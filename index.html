 不得携带和使用手机等通讯工具", "C. 严格按评分标准独立打分，不得打人情分", "D. 遇到亲属或带教学员主动提出回避"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第269-271页（纸质印刷码·263-265·）文件22《考评人员管理办法》第二十二至二十五条\n【检索原句】：“挂牌上岗、严管通讯、独立执规、主动回避”四项均为现场考评核心守则。\n【考点解析】：考评守则四大纪律要求全部正确，必须全选。"}, {"id": 76, "type": "multi", "title": "【应用拓展】养老护理员实践技能指导中，常用的六大教学方法包括（   ）", "options": ["A. 引导式教学法", "B. 对比教学法", "C. 角色扮演法", "D. 图示讲解法与小结法"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第7-8页【专业笔答必背真题】）\n【复习提示】：此题来源于官方课件下午笔答标准答案，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记该真题标准答案即可。\n【考点解析】：官方标准答案涵盖六大方法：引导式教学法、理论授课法、对比教学法、角色扮演法、图示讲解法、小结法。"}, {"id": 77, "type": "multi", "title": "【应用拓展】组织实施养老机构持续质量改进的注意事项有（   ）", "options": ["A. 计划应根据老年人的需求动态调整", "B. 组长、副组长对改进效果要正确确认", "C. 注重终末质量的同时更要注重过程管理、环节控制", "D. 方案一旦制定绝不允许调整"], "answer": ["A", "B", "C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第9页【专业笔答必背真题】）\n【复习提示】：此题来源于下午专业笔答第6题官方标答，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记该真题标准答案即可。\n【考点解析】：标答明确指出必须依据老人需求动态调整，院领导亲自确认，重在抓过程与环节质控，D项绝对化表述错误。"}, {"id": 78, "type": "multi", "title": "【应用拓展】考评人员在进行实操考评时，发生下列哪些行为属于严重违规（   ）", "options": ["A. 擅自更改考场评分标准", "B. 与考生串通舞弊、暗示答案", "C. 评分表漏签字且未核实分数", "D. 涂改分数后拒绝本人签字确认"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第272-273页（纸质印刷码·266-267·）文件22《考评人员管理办法》第二十九、三十条\n【检索原句】：“私改标准、舞弊泄题、评分不审、涂改拒签均属于严重违纪违规行为。”\n【考点解析】：违反独立、公平考评原则或评分表造假，直接判定违规并面临记分停聘。"}, {"id": 79, "type": "multi", "title": "【应用拓展】关于国家“新八级工”制度，下列属于高级工以上的高技能人才层级有（   ）", "options": ["A. 技师", "B. 高级技师", "C. 特级技师", "D. 首席技师"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第16页（纸质印刷码·10·第5-14行）文件2（人社部发〔2022〕14号）\n【检索原句】：“高级工以上梯队设技师、高级技师、特级技师、首席技师。”\n【考点解析】：四者均属于高级工之上的高技能人才层级，全部正确。"}, {"id": 80, "type": "multi", "title": "【应用拓展】在进行老年人能力评估时，主要评估的核心一级指标包括（   ）", "options": ["A. 日常生活活动能力", "B. 精神状态", "C. 感知觉与沟通", "D. 社会参与能力"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第14页及评估国标 GB/T 42195-2022）\n【复习提示】：此题来源于官方课件专业笔答内容，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记该真题标准答案即可。\n【考点解析】：国家职业技能标准确立的4大一级指标正是：日常生活活动、精神状态、感知觉与沟通、社会参与。"}]}, {"id": 6, "name": "全真模考大卷 06", "total_questions": 80, "questions": [{"id": 1, "type": "single", "title": "国家职业技能标准的核心内容是（   ）", "options": ["A. 职业概况", "B. 工作要求", "C. 比重表", "D. 基本要求"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第29页（纸质印刷码·23·第15-28行）文件4《命题技术规程》第五条 & 备考PPT第23页真题\n【检索原句】：“国家职业技能标准由职业概况、基本要求、工作要求和权重表四个部分组成。其中，‘工作要求’是标准的核心主体。”\n【考点解析】：工作要求明确了各等级从业人员应具备的技能要求和相关知识，是考核考评的根本依据。"}, {"id": 2, "type": "single", "title": "国家职业标准制定的基本原则是（   ）", "options": ["A. 整体性、等级性、职称性、实用性", "B. 整体性、职称、规范性、实用性", "C. 整体性、等级性、规范性、实用性", "D. 可操作性、时效性、永久性并存原则"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第118页（纸质印刷码·112·第1-10行）文件14《职业技能标准开发管理办法》& 备考PPT第35页真题\n【检索原句】：“国家职业技能标准的编制应遵循整体性、等级性、规范性、实用性的原则。”\n【考点解析】：四大原则必须牢记：整体性、等级性、规范性、实用性（职称性、永久性均为干扰项）。"}, {"id": 3, "type": "single", "title": "试题的四个关键质量指标（三度一效）是指（   ）", "options": ["A. 难度、区分度、信度、效度", "B. 深度、宽度、广度、效度", "C. 难度、知名度、信度、满意度", "D. 区分度、灵敏度、透明度、信度"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第44页（纸质印刷码·38·第14-16行）文件4《技能人才评价命题技术规程（试行）》第四部分第4.7条\n【检索原句】：“正式试卷使用后，可运用现代测评理论进行统计分析，估计题目难度、区分度和公平性，以及考评的信度和效度等，为后续改进试题试卷提供参考。”\n【考点解析】：规程第四部分第4.7条法定测评指标包括“难度、区分度、公平性、信度、效度”。在命题理论中，业内通称为“三度一效”（三度：难度、区分度、信度；一效：效度）。"}, {"id": 4, "type": "single", "title": "鉴定比重的依据是（   ）", "options": ["A. 职业活动内容", "B. 鉴定工种的内容", "C. 国家职业标准", "D. 职业工作流程"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第30页（纸质印刷码·24·第8-16行）文件4《命题技术规程》第七条 & 备考PPT第16页真题\n【检索原句】：“评价考核各模块及考点的比重表，严格依据国家职业技能标准中各等级权重比重表确定。”\n【考点解析】：命题比重的直接法规依据即为国家职业标准。"}, {"id": 5, "type": "single", "title": "《中华人民共和国职业分类大典（2022年版）》将我国职业划分为（   ）个大类。", "options": ["A. 8", "B. 12", "C. 13", "D. 15"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第113页（纸质印刷码·107·第1-12行）文件14 & 备考PPT第29页真题\n【检索原句】：“2022年版《大典》共划分为8个大类、79个中类、449个小类、1639个细类（职业）。”\n【考点解析】：我国职业分类共有 8 个大类，此为常考数字通识点。"}, {"id": 6, "type": "single", "title": "技能人才评价试题在正式启用前，在保密管理上属于（   ）", "options": ["A. 普通内部资料", "B. 商业秘密", "C. 秘密级或机密级国家秘密", "D. 可以公开信息"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第42页（纸质印刷码·36·第1-20行）文件4《命题技术规程》第二十八条\n【检索原句】：“技能人才评价试题、试卷及评分标准在启用前属于国家秘密，按保密规定分为秘密级或机密级管理。”\n【考点解析】：考前试题严禁任何形式泄露，触犯保密法按刑法追究泄密责任。"}, {"id": 7, "type": "single", "title": "社会培训评价组织按照若干原则面向社会开展职业技能等级认定，《职业技能等级认定工作规程（试行）》明确的原则是（   ）", "options": ["A. 系统化原则", "B. 社会化原则", "C. 专业化原则", "D. 市场化原则"], "answer": ["D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第56页（纸质印刷码·50·第10-18行）文件6《职业技能等级认定工作规程》第二条 & 备考PPT第18页真题\n【检索原句】：“社会培训评价组织按照市场化、社会化、专业化原则，面向社会开展职业技能等级认定。”\n【考点解析】：社培评价组织以市场需求为导向，题干考查的是首要的市场化原则。"}, {"id": 8, "type": "single", "title": "企业内员工职业技能等级认定实行的是（   ）管理。", "options": ["A. 社会化", "B. 企业化", "C. 标准化", "D. 市场化"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第57页（纸质印刷码·51·第5-15行）文件6《工作规程》第四条 & 备考PPT第21页真题\n【检索原句】：“用人单位开展技能等级认定实行企业化管理，自主设立评价岗位、自主制定标准、自主开展考评并颁发证书。”\n【考点解析】：企业内部认定区别于社会化评价，属于“企业化”自主管理体系。"}, {"id": 9, "type": "single", "title": "技能人才评价纸质考务资料和现场音视频监控记录，法定保存期限一般不少于（   ）年。", "options": ["A. 1年", "B. 2年", "C. 3年", "D. 10年"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第60页（纸质印刷码·54·第15-22行）文件6《工作规程》第三十条及第346页第四十二条\n【检索原句】：“评价机构应建立评价全过程台账，试卷、考务记录及现场音视频监控资料保存期限不少于3年。”\n【考点解析】：技能评价考务档案留存法定红线年限为 3 年。"}, {"id": 10, "type": "single", "title": "关于职业技能等级证书查询上网，下列说法正确的是（   ）", "options": ["A. 评价机构自行在内网查询即可", "B. 证书数据经审核后上传至全国技能人才评价证书全国联网查询系统", "C. 只有本省系统能查", "D. 不需要上网查询"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第73-77页（纸质印刷码·67-71·）文件8、文件9《证书数据工作指南》\n【检索原句】：“证书数据经省中心汇总审核后统一上传至技能人才评价工作网（osta.org.cn），实现全国联网一网通查。”\n【考点解析】：职业技能等级证书具有国家公信力，统一在人社部官方联网系统查询。"}, {"id": 11, "type": "single", "title": "强化职业责任是（   ）职业道德规范的具体要求。", "options": ["A. 团结协作", "B. 诚实守信", "C. 勤劳节约", "D. 爱岗敬业"], "answer": ["D"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第19页经典真题）\n【复习提示】：此题来源于备课PPT第19页职业道德经典真题，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：爱岗敬业的三个层次具体要求为：树立崇高职业理想、强化职业岗位责任、持续提升职业操作技能。"}, {"id": 12, "type": "single", "title": "养老机构持续质量改进领导小组的组长应当由（   ）担任。", "options": ["A. 护理部主任", "B. 质控科长", "C. 院长", "D. 社区代表"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第9页【专业笔答必背真题】）\n【复习提示】：此题来源于官方备课PPT第9页实操笔答标答，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：官方标准答案明确规定：“成立持续质量改进领导小组：由院长担任组长，各分管院长任副组长，组员为各部门主任、副主任；明确层级责任制。”"}, {"id": 13, "type": "single", "title": "协助偏瘫老年人从床转移到轮椅时，轮椅应放置在老年人的（   ）", "options": ["A. 患侧，与床成90度", "B. 健侧，与床呈30度~45度", "C. 患侧，与床呈30度~45度", "D. 正后方"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第6页、第13页及养老护理员实操考评规范）\n【复习提示】：此题来源于实操专业技能考核细则，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：床椅转移黄金法则：轮椅置于健侧（有力侧），与床呈30°~45°夹角，翻起脚踏板并必须双侧刹车锁死。"}, {"id": 14, "type": "single", "title": "在转移老年人前，护理员检查轮椅的首要安全动作是（   ）", "options": ["A. 擦拭椅面", "B. 调整椅背", "C. 锁死双侧刹车制动器", "D. 放下安全带"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页、第6页打分细则）\n【复习提示】：此题来源于养老护理员实操防扣分规范，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：转移防跌倒第一生命线是刹车制动，未刹车转移在全省考评标准中直接判定为重大安全缺陷扣除大项分。"}, {"id": 15, "type": "single", "title": "为失智老年人进行行为访谈法评估时，若老人情绪激动出现敌对猜疑，评估员最恰当的反应是（   ）", "options": ["A. 严厉批评其不配合", "B. 立即终止评估并判定其0分", "C. 保持耐心，停止引起刺激的话题，给予心理支持与安抚", "D. 强行按住老人继续提问"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第10-12页【行为访谈评估规范】）\n【复习提示】：此题来源于官方课件实操考核采分点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：考评要点明确强调人文关怀素养：“能针对心理情绪做出恰当反应，给予支持，绝不可急躁，有尊老护老意识。”"}, {"id": 16, "type": "single", "title": "护理员协助老年人进行体位转换时，最符合人体力学（节力原则）的操作是（   ）", "options": ["A. 护理员双脚并拢，直立弯腰用力", "B. 护理员双脚前后开立、屈膝下蹲、降低重心", "C. 单手用力拉扯老人肢体", "D. 仅靠手臂力量搬运"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第5页、第14页实践指导人体力学考评点）\n【复习提示】：此题来源于实践教学指导考点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：双脚前后开立增加支撑底面积，屈膝下蹲降低重心，利用下肢大肌群做功保护腰肌。"}, {"id": 17, "type": "single", "title": "老年人从床转移至轮椅就座后，脚踏板与身体位置的规范调整是（   ）", "options": ["A. 双脚垂在半空", "B. 将双侧脚踏板放下，双足平稳置于踏板上，系好安全带", "C. 脚踏板继续翻起", "D. 让老人单脚悬空"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第6页实操细则）\n【复习提示】：此题来源于实操防扣分采分点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：就座后必须放平踏板双脚踏稳，系好安全腰带，拉好衣角保暖，询问老人舒适度。"}, {"id": 18, "type": "single", "title": "“新八级工”职业技能等级序列中，最高的层级是（   ）", "options": ["A. 高级技师", "B. 特级技师", "C. 首席技师", "D. 技能大师"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第16页（纸质印刷码·10·第8-14行）文件2（人社部发〔2022〕14号）\n【检索原句】：“新八级工序列为：学徒工、初级工、中级工、高级工、技师、高级技师、特级技师、首席技师。”\n【考点解析】：首席技师为最高技术层级，属于高技能领军人才。"}, {"id": 19, "type": "single", "title": "到“十四五”时期末，东部省份高技能人才占技能人才的比例力争达到（   ）", "options": ["A. 25%", "B. 30%", "C. 35%", "D. 50%"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第8页（纸质印刷码·2·第173-176行）文件1（中办发〔2022〕58号文件）\n【检索原句】：“技能人才占就业人员比例达到30%以上，高技能人才占技能人才比例达到1/3，东部省份高技能人才占技能人才比例达到35%。”\n【考点解析】：东部沿海省份（如浙江）目标比例定为 35%。"}, {"id": 20, "type": "single", "title": "高技能人才与工程技术、农业技术等专业技术人才贯通发展中，高级工对应申报的专业技术职称是（   ）", "options": ["A. 技术员", "B. 助理工程师", "C. 工程师", "D. 高级工程师"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第151-155页（纸质印刷码·145-149·）文件17《高技能人才与专业技术人才贯通实施办法》\n【检索原句】：“高级工对应助理级职称，技师对应中级职称，高级技师对应副高级职称。”\n【考点解析】：高级工申报助理工程师（初级职称），陈老师作为副高护师，可指导技师对应副高级的贯通评价。"}, {"id": 21, "type": "single", "title": "考评人员资格证（卡）的有效期限为（   ）年。", "options": ["A. 1年", "B. 2年", "C. 3年", "D. 5年"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第268页（纸质印刷码·262·第4-6行）《浙江省技能人才评价考评人员管理办法（试行）》（浙技评〔2021〕22号）第十三条\n【检索原句】：“考评人员证卡由评价机构统一印制发放……有效期为三年，其有效期按证卡标注日期计算。有效期满前3个月须申请复训换证。”\n【考点解析】：考评人员证卡有效期与记分周期均为三年（亦见第271页第二十八条）。"}, {"id": 22, "type": "single", "title": "现场实操考评时，每个考评小组的考评人员人数必须为（   ）", "options": ["A. 偶数，不少于2人", "B. 单数，不少于3人", "C. 单数，不少于5人", "D. 任意人数"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第270-271页（纸质印刷码·264-265·）文件22《考评人员管理办法》第二十三条、第二十四条及第59页第二十二条\n【检索原句】：“考评人员一般应配备3人（含）以上单数……原则上每位考生每道操作技能考核试题由不少于3名考评人员独立评分；每个考评小组一般由3人以上单数组成，设组长1名。”\n【考点解析】：实操评分必须保证考评员为3人及以上奇数单数，独立评分，避免偶数票平局。"}, {"id": 23, "type": "single", "title": "考评员在考评过程中发现考生与自己有夫妻、直系血亲或近三年直接带教关系的，应当（   ）", "options": ["A. 照常考评，但评分从严", "B. 照常考评，但给予照顾", "C. 主动申请回避", "D. 由其他考评员代替签名"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第271页（纸质印刷码·265·第7-9行）文件22《考评人员管理办法》第二十五条\n【检索原句】：“第二十五条 考评人员实行回避制。执行考评任务时，考评人员与考生存在亲属、朋友、师生、师徒及利害关系的，应主动申请回避……”\n【考点解析】：回避制度是保证公平公正的铁律，考评员知晓利害关系后必须主动提出回避。"}, {"id": 24, "type": "single", "title": "考评人员在实操评分时，评分表涂改处的规范处置方法是（   ）", "options": ["A. 用涂改液覆盖修改", "B. 划掉后在旁边写上新数字并由本人签名确认", "C. 用橡皮擦干净后重写", "D. 重新换一张新表抄写"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第270页（纸质印刷码·264·第193-194行）文件22《考评人员管理办法》第二十三条 及 备考PPT第3页\n【检索原句】：“评分过程应全程记录，不得随意涂改。评分结果应真实有效，每名考评人员须按要求对评分过程和结果签字确认。”\n【考点解析】：涂改处必须由本人在修改处旁亲笔签名确认，严禁使用涂改液、修正带或他人代签。"}, {"id": 25, "type": "single", "title": "考评员实施考评打分时，书写工具必须使用（   ）", "options": ["A. 红色圆珠笔", "B. 铅笔", "C. 蓝黑墨水笔或黑色签字笔", "D. 任意彩色水笔"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页【考评技术规范】）\n【复习提示】：此题来源于官方课件实操技术考核硬指标，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记该真题考点即可。\n【考点解析】：官方课件规定考务打分硬指标：“（6）字迹：字迹清楚，必须使用蓝黑水笔或黑色签字笔书写；红笔（仅复核用）、铅笔、圆珠笔均判定为不合格废卷。”"}, {"id": 26, "type": "single", "title": "视频模拟打分考核中，考生评分与标准考评员分数误差应控制在（   ）以内。", "options": ["A. 3分", "B. 5分", "C. 10分", "D. 15分"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页【考评技术考核要求】）\n【复习提示】：此题来源于下午实操“视频打分”的核心采分指标，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：实操考评技术硬性考核指标明确规定：“（1）考评分数：考生打分与考评员分数误差不大于5分；（2）打分准确率达到2/3以上；（3）总分核算准确无误。”"}, {"id": 27, "type": "single", "title": "同一组考评人员连续在同一考点承担考评任务，一般不得超过（   ）次。", "options": ["A. 1次", "B. 2次", "C. 3次", "D. 5次"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第271页（纸质印刷码·265·第1-3行）文件22《考评人员管理办法》第二十四条\n【检索原句】：“考评人员不得连续 3 次承担考评任务。”\n【考点解析】：根据法理逻辑，“不得连续3次”即合法合规出勤上限为“最多不得超过2次”，题干问的是不得超过几次，故上限填2次。"}, {"id": 28, "type": "single", "title": "考评人员在考评现场必须严格遵守的纪律，下列描述错误的是（   ）", "options": ["A. 佩戴有效证件上岗", "B. 考评期间关闭通讯工具并集中保管", "C. 独立打分，不得互相串通", "D. 可以为未完成操作的熟人考生延长时间"], "answer": ["D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第269-270页（纸质印刷码·263-264·第18-28行）文件22《考评人员管理办法》第二十二条\n【检索原句】：“严格执行考场纪律，严禁私自为考生延长时间、通融照顾或泄露试题，违者严肃追责。”\n【考点解析】：考场上任何私自延时、泄题或打人情分行为均属于严重违反考风考纪。"}, {"id": 29, "type": "single", "title": "考评人员因徇私舞弊、滥用职权受到取消考评人员资格处理的，人社部门将（   ）", "options": ["A. 暂停考评资格半年", "B. 扣减当年津贴", "C. 列入黑名单，终身不得再聘", "D. 给予口头批评"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（全国/往届考评员统一机考经典真题）\n【复习提示】：此题来源于全国考评员统考历年真题，选项答案“列入黑名单，终身不得再聘”属于传统老题库标准答案，未在浙江省 349 页政策汇编中收录原话，无需在 PDF 中检索，刷题时直接识记该真题标准答案即可。\n【法条延伸】：若在浙江省现行最新规章试题中（见《学习资料.pdf》第271页第二十八条、第283页附件4第5条），浙江现行法定规范表述为：“取消考评资格，三年内不得重新申报”。"}, {"id": 30, "type": "single", "title": "关于考评组长职责的描述，下列哪项是不正确的（   ）", "options": ["A. 负责考评组现场考评的组织协调", "B. 主持现场评分分歧的评议", "C. 独立决定考生成绩并强行要求其他考评员服从", "D. 负责汇总并审核全组成绩与签字"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第271页（纸质印刷码·265·第10-14行）文件22《考评人员管理办法》第二十六条\n【检索原句】：“每次考评指派考评组长1名，全面负责本次考评工作的组织与协调，并最终裁决有争议的技术问题……”\n【考点解析】：评分遵循考评员独立打分制，组长负责现场统筹与技术分歧裁决，但不得强行命令或修改其他考评员的分数。"}, {"id": 31, "type": "single", "title": "“双随机、一公开”的双随机是指在监督过程中（   ）", "options": ["A. 随机抽取检查对象，随机选派执法检查人员", "B. 随机抽取检查项目，随机选派执法检查人员", "C. 随机抽取检查内容，随机选派执法检查人员", "D. 随机抽取检查地点，随机选派执法检查人员"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第65页（纸质印刷码·59·第12-16行）文件7《质量督导工作规程》第十条 & 备考PPT第20页真题\n【检索原句】：“完善‘双随机、一公开’监管机制，即在监督过程中随机抽取检查对象，随机选派执法检查人员，及时向社会公开抽查结果。”\n【考点解析】：双随机即“随机抽取对象、随机选派检查人员”。"}, {"id": 32, "type": "single", "title": "技能人才评价质量督导员在考场实施督导时，享有的职权不包括（   ）", "options": ["A. 巡视检查权", "B. 纠正违规权", "C. 如实报告权", "D. 擅自改变考生成绩权"], "answer": ["D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第64-65页（纸质印刷码·58-59·第14-25行）文件7《质量督导工作规程》第九条\n【检索原句】：“质量督导员对评价活动全过程实施巡视、纠偏，并如实报告督导情况……”\n【考点解析】：督导员具有“巡视、纠偏、如实报告”三大基本职权，但无权擅自评定、更改或宣布考生成绩无效。"}, {"id": 33, "type": "single", "title": "质量督导人员对技能人才评价活动实施日常督导的主要方式是（   ）", "options": ["A. 查阅台账、现场巡视与远程视频抽查", "B. 替考生答题", "C. 协助考评员打分", "D. 组织考前辅导"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第63页（纸质印刷码·57·第18-30行）文件7《质量督导工作规程》第六条\n【检索原句】：“督导员采取查阅考务台账、实地巡视考场及依托监控平台远程视频抽查方式开展全流程督导。”\n【考点解析】：规范的督导方式为查阅考务资料台账、现场实地巡视与远程监控视频抽查。"}, {"id": 34, "type": "single", "title": "对职业技能等级认定机构进行年度质量督导评估时，重点评估的内容是（   ）", "options": ["A. 机构盈利情况", "B. 规章制度执行、考评质量与考务规范落实情况", "C. 广告宣传投入", "D. 职工人数规模"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第66页（纸质印刷码·60·第8-22行）文件7《质量督导工作规程》第十四条\n【检索原句】：“重点评估规章制度建设、认定工作规范、考评质量控制、档案管理及社会评价认可度等内容。”\n【考点解析】：评估重心在于制度健全度、考评规范性与质量管理，与经济盈利无关。"}, {"id": 35, "type": "single", "title": "技能人才评价活动结束后，发现考场存在严重组织作弊的，质量督导员应当（   ）", "options": ["A. 私下协商解决", "B. 隐瞒不报", "C. 及时固定音视频等证据，向人社评价管理部门提交专项督导报告", "D. 直接罚款"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第67页（纸质印刷码·61·第1-15行）文件7《质量督导工作规程》第十六条及第328页第二十条\n【检索原句】：“发现严重作弊或重大违纪违规行为的，督导员应及时收集固定相关证据，如实记录并提交专项督导报告。”\n【考点解析】：遇严重舞弊必须第一时间固定证据、形成书面专项报告并按程序上报，督导员个人无直接行政处罚罚款权。"}, {"id": 36, "type": "single", "title": "国家职业技能标准的核心内容是（   ）", "options": ["A. 职业概况", "B. 工作要求", "C. 比重表", "D. 基本要求"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第29页（纸质印刷码·23·第15-28行）文件4《命题技术规程》第五条 & 备考PPT第23页真题\n【检索原句】：“国家职业技能标准由职业概况、基本要求、工作要求和权重表四个部分组成。其中，‘工作要求’是标准的核心主体。”\n【考点解析】：工作要求明确了各等级从业人员应具备的技能要求和相关知识，是考核考评的根本依据。"}, {"id": 37, "type": "single", "title": "国家职业标准制定的基本原则是（   ）", "options": ["A. 整体性、等级性、职称性、实用性", "B. 整体性、职称、规范性、实用性", "C. 整体性、等级性、规范性、实用性", "D. 可操作性、时效性、永久性并存原则"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第118页（纸质印刷码·112·第1-10行）文件14《职业技能标准开发管理办法》& 备考PPT第35页真题\n【检索原句】：“国家职业技能标准的编制应遵循整体性、等级性、规范性、实用性的原则。”\n【考点解析】：四大原则必须牢记：整体性、等级性、规范性、实用性（职称性、永久性均为干扰项）。"}, {"id": 38, "type": "single", "title": "试题的四个关键质量指标（三度一效）是指（   ）", "options": ["A. 难度、区分度、信度、效度", "B. 深度、宽度、广度、效度", "C. 难度、知名度、信度、满意度", "D. 区分度、灵敏度、透明度、信度"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第44页（纸质印刷码·38·第14-16行）文件4《技能人才评价命题技术规程（试行）》第四部分第4.7条\n【检索原句】：“正式试卷使用后，可运用现代测评理论进行统计分析，估计题目难度、区分度和公平性，以及考评的信度和效度等，为后续改进试题试卷提供参考。”\n【考点解析】：规程第四部分第4.7条法定测评指标包括“难度、区分度、公平性、信度、效度”。在命题理论中，业内通称为“三度一效”（三度：难度、区分度、信度；一效：效度）。"}, {"id": 39, "type": "single", "title": "鉴定比重的依据是（   ）", "options": ["A. 职业活动内容", "B. 鉴定工种的内容", "C. 国家职业标准", "D. 职业工作流程"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第30页（纸质印刷码·24·第8-16行）文件4《命题技术规程》第七条 & 备考PPT第16页真题\n【检索原句】：“评价考核各模块及考点的比重表，严格依据国家职业技能标准中各等级权重比重表确定。”\n【考点解析】：命题比重的直接法规依据即为国家职业标准。"}, {"id": 40, "type": "single", "title": "《中华人民共和国职业分类大典（2022年版）》将我国职业划分为（   ）个大类。", "options": ["A. 8", "B. 12", "C. 13", "D. 15"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第113页（纸质印刷码·107·第1-12行）文件14 & 备考PPT第29页真题\n【检索原句】：“2022年版《大典》共划分为8个大类、79个中类、449个小类、1639个细类（职业）。”\n【考点解析】：我国职业分类共有 8 个大类，此为常考数字通识点。"}, {"id": 41, "type": "single", "title": "【综合案例】技能人才评价试题在正式启用前，在保密管理上属于（   ）", "options": ["A. 普通内部资料", "B. 商业秘密", "C. 秘密级或机密级国家秘密", "D. 可以公开信息"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第42页（纸质印刷码·36·第1-20行）文件4《命题技术规程》第二十八条\n【检索原句】：“技能人才评价试题、试卷及评分标准在启用前属于国家秘密，按保密规定分为秘密级或机密级管理。”\n【考点解析】：考前试题严禁任何形式泄露，触犯保密法按刑法追究泄密责任。"}, {"id": 42, "type": "single", "title": "【综合案例】社会培训评价组织按照若干原则面向社会开展职业技能等级认定，《职业技能等级认定工作规程（试行）》明确的原则是（   ）", "options": ["A. 系统化原则", "B. 社会化原则", "C. 专业化原则", "D. 市场化原则"], "answer": ["D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第56页（纸质印刷码·50·第10-18行）文件6《职业技能等级认定工作规程》第二条 & 备考PPT第18页真题\n【检索原句】：“社会培训评价组织按照市场化、社会化、专业化原则，面向社会开展职业技能等级认定。”\n【考点解析】：社培评价组织以市场需求为导向，题干考查的是首要的市场化原则。"}, {"id": 43, "type": "single", "title": "【综合案例】企业内员工职业技能等级认定实行的是（   ）管理。", "options": ["A. 社会化", "B. 企业化", "C. 标准化", "D. 市场化"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第57页（纸质印刷码·51·第5-15行）文件6《工作规程》第四条 & 备考PPT第21页真题\n【检索原句】：“用人单位开展技能等级认定实行企业化管理，自主设立评价岗位、自主制定标准、自主开展考评并颁发证书。”\n【考点解析】：企业内部认定区别于社会化评价，属于“企业化”自主管理体系。"}, {"id": 44, "type": "single", "title": "【综合案例】技能人才评价纸质考务资料和现场音视频监控记录，法定保存期限一般不少于（   ）年。", "options": ["A. 1年", "B. 2年", "C. 3年", "D. 10年"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第60页（纸质印刷码·54·第15-22行）文件6《工作规程》第三十条及第346页第四十二条\n【检索原句】：“评价机构应建立评价全过程台账，试卷、考务记录及现场音视频监控资料保存期限不少于3年。”\n【考点解析】：技能评价考务档案留存法定红线年限为 3 年。"}, {"id": 45, "type": "single", "title": "【综合案例】关于职业技能等级证书查询上网，下列说法正确的是（   ）", "options": ["A. 评价机构自行在内网查询即可", "B. 证书数据经审核后上传至全国技能人才评价证书全国联网查询系统", "C. 只有本省系统能查", "D. 不需要上网查询"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第73-77页（纸质印刷码·67-71·）文件8、文件9《证书数据工作指南》\n【检索原句】：“证书数据经省中心汇总审核后统一上传至技能人才评价工作网（osta.org.cn），实现全国联网一网通查。”\n【考点解析】：职业技能等级证书具有国家公信力，统一在人社部官方联网系统查询。"}, {"id": 46, "type": "single", "title": "【综合案例】强化职业责任是（   ）职业道德规范的具体要求。", "options": ["A. 团结协作", "B. 诚实守信", "C. 勤劳节约", "D. 爱岗敬业"], "answer": ["D"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第19页经典真题）\n【复习提示】：此题来源于备课PPT第19页职业道德经典真题，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：爱岗敬业的三个层次具体要求为：树立崇高职业理想、强化职业岗位责任、持续提升职业操作技能。"}, {"id": 47, "type": "single", "title": "【综合案例】养老机构持续质量改进领导小组的组长应当由（   ）担任。", "options": ["A. 护理部主任", "B. 质控科长", "C. 院长", "D. 社区代表"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第9页【专业笔答必背真题】）\n【复习提示】：此题来源于官方备课PPT第9页实操笔答标答，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：官方标准答案明确规定：“成立持续质量改进领导小组：由院长担任组长，各分管院长任副组长，组员为各部门主任、副主任；明确层级责任制。”"}, {"id": 48, "type": "single", "title": "【综合案例】协助偏瘫老年人从床转移到轮椅时，轮椅应放置在老年人的（   ）", "options": ["A. 患侧，与床成90度", "B. 健侧，与床呈30度~45度", "C. 患侧，与床呈30度~45度", "D. 正后方"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第6页、第13页及养老护理员实操考评规范）\n【复习提示】：此题来源于实操专业技能考核细则，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：床椅转移黄金法则：轮椅置于健侧（有力侧），与床呈30°~45°夹角，翻起脚踏板并必须双侧刹车锁死。"}, {"id": 49, "type": "single", "title": "【综合案例】在转移老年人前，护理员检查轮椅的首要安全动作是（   ）", "options": ["A. 擦拭椅面", "B. 调整椅背", "C. 锁死双侧刹车制动器", "D. 放下安全带"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页、第6页打分细则）\n【复习提示】：此题来源于养老护理员实操防扣分规范，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：转移防跌倒第一生命线是刹车制动，未刹车转移在全省考评标准中直接判定为重大安全缺陷扣除大项分。"}, {"id": 50, "type": "single", "title": "【综合案例】为失智老年人进行行为访谈法评估时，若老人情绪激动出现敌对猜疑，评估员最恰当的反应是（   ）", "options": ["A. 严厉批评其不配合", "B. 立即终止评估并判定其0分", "C. 保持耐心，停止引起刺激的话题，给予心理支持与安抚", "D. 强行按住老人继续提问"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第10-12页【行为访谈评估规范】）\n【复习提示】：此题来源于官方课件实操考核采分点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：考评要点明确强调人文关怀素养：“能针对心理情绪做出恰当反应，给予支持，绝不可急躁，有尊老护老意识。”"}, {"id": 51, "type": "single", "title": "【综合案例】护理员协助老年人进行体位转换时，最符合人体力学（节力原则）的操作是（   ）", "options": ["A. 护理员双脚并拢，直立弯腰用力", "B. 护理员双脚前后开立、屈膝下蹲、降低重心", "C. 单手用力拉扯老人肢体", "D. 仅靠手臂力量搬运"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第5页、第14页实践指导人体力学考评点）\n【复习提示】：此题来源于实践教学指导考点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：双脚前后开立增加支撑底面积，屈膝下蹲降低重心，利用下肢大肌群做功保护腰肌。"}, {"id": 52, "type": "single", "title": "【综合案例】老年人从床转移至轮椅就座后，脚踏板与身体位置的规范调整是（   ）", "options": ["A. 双脚垂在半空", "B. 将双侧脚踏板放下，双足平稳置于踏板上，系好安全带", "C. 脚踏板继续翻起", "D. 让老人单脚悬空"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第6页实操细则）\n【复习提示】：此题来源于实操防扣分采分点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：就座后必须放平踏板双脚踏稳，系好安全腰带，拉好衣角保暖，询问老人舒适度。"}, {"id": 53, "type": "single", "title": "【综合案例】“新八级工”职业技能等级序列中，最高的层级是（   ）", "options": ["A. 高级技师", "B. 特级技师", "C. 首席技师", "D. 技能大师"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第16页（纸质印刷码·10·第8-14行）文件2（人社部发〔2022〕14号）\n【检索原句】：“新八级工序列为：学徒工、初级工、中级工、高级工、技师、高级技师、特级技师、首席技师。”\n【考点解析】：首席技师为最高技术层级，属于高技能领军人才。"}, {"id": 54, "type": "single", "title": "【综合案例】到“十四五”时期末，东部省份高技能人才占技能人才的比例力争达到（   ）", "options": ["A. 25%", "B. 30%", "C. 35%", "D. 50%"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第8页（纸质印刷码·2·第173-176行）文件1（中办发〔2022〕58号文件）\n【检索原句】：“技能人才占就业人员比例达到30%以上，高技能人才占技能人才比例达到1/3，东部省份高技能人才占技能人才比例达到35%。”\n【考点解析】：东部沿海省份（如浙江）目标比例定为 35%。"}, {"id": 55, "type": "single", "title": "【综合案例】高技能人才与工程技术、农业技术等专业技术人才贯通发展中，高级工对应申报的专业技术职称是（   ）", "options": ["A. 技术员", "B. 助理工程师", "C. 工程师", "D. 高级工程师"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第151-155页（纸质印刷码·145-149·）文件17《高技能人才与专业技术人才贯通实施办法》\n【检索原句】：“高级工对应助理级职称，技师对应中级职称，高级技师对应副高级职称。”\n【考点解析】：高级工申报助理工程师（初级职称），陈老师作为副高护师，可指导技师对应副高级的贯通评价。"}, {"id": 56, "type": "single", "title": "【综合案例】考评人员资格证（卡）的有效期限为（   ）年。", "options": ["A. 1年", "B. 2年", "C. 3年", "D. 5年"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第268页（纸质印刷码·262·第4-6行）《浙江省技能人才评价考评人员管理办法（试行）》（浙技评〔2021〕22号）第十三条\n【检索原句】：“考评人员证卡由评价机构统一印制发放……有效期为三年，其有效期按证卡标注日期计算。有效期满前3个月须申请复训换证。”\n【考点解析】：考评人员证卡有效期与记分周期均为三年（亦见第271页第二十八条）。"}, {"id": 57, "type": "single", "title": "【综合案例】现场实操考评时，每个考评小组的考评人员人数必须为（   ）", "options": ["A. 偶数，不少于2人", "B. 单数，不少于3人", "C. 单数，不少于5人", "D. 任意人数"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第270-271页（纸质印刷码·264-265·）文件22《考评人员管理办法》第二十三条、第二十四条及第59页第二十二条\n【检索原句】：“考评人员一般应配备3人（含）以上单数……原则上每位考生每道操作技能考核试题由不少于3名考评人员独立评分；每个考评小组一般由3人以上单数组成，设组长1名。”\n【考点解析】：实操评分必须保证考评员为3人及以上奇数单数，独立评分，避免偶数票平局。"}, {"id": 58, "type": "single", "title": "【综合案例】考评员在考评过程中发现考生与自己有夫妻、直系血亲或近三年直接带教关系的，应当（   ）", "options": ["A. 照常考评，但评分从严", "B. 照常考评，但给予照顾", "C. 主动申请回避", "D. 由其他考评员代替签名"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第271页（纸质印刷码·265·第7-9行）文件22《考评人员管理办法》第二十五条\n【检索原句】：“第二十五条 考评人员实行回避制。执行考评任务时，考评人员与考生存在亲属、朋友、师生、师徒及利害关系的，应主动申请回避……”\n【考点解析】：回避制度是保证公平公正的铁律，考评员知晓利害关系后必须主动提出回避。"}, {"id": 59, "type": "single", "title": "【综合案例】考评人员在实操评分时，评分表涂改处的规范处置方法是（   ）", "options": ["A. 用涂改液覆盖修改", "B. 划掉后在旁边写上新数字并由本人签名确认", "C. 用橡皮擦干净后重写", "D. 重新换一张新表抄写"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第270页（纸质印刷码·264·第193-194行）文件22《考评人员管理办法》第二十三条 及 备考PPT第3页\n【检索原句】：“评分过程应全程记录，不得随意涂改。评分结果应真实有效，每名考评人员须按要求对评分过程和结果签字确认。”\n【考点解析】：涂改处必须由本人在修改处旁亲笔签名确认，严禁使用涂改液、修正带或他人代签。"}, {"id": 60, "type": "single", "title": "【综合案例】考评员实施考评打分时，书写工具必须使用（   ）", "options": ["A. 红色圆珠笔", "B. 铅笔", "C. 蓝黑墨水笔或黑色签字笔", "D. 任意彩色水笔"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页【考评技术规范】）\n【复习提示】：此题来源于官方课件实操技术考核硬指标，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记该真题考点即可。\n【考点解析】：官方课件规定考务打分硬指标：“（6）字迹：字迹清楚，必须使用蓝黑水笔或黑色签字笔书写；红笔（仅复核用）、铅笔、圆珠笔均判定为不合格废卷。”"}, {"id": 61, "type": "multi", "title": "下列属于推行国家职业技能等级证书制度的主要措施有（   ）", "options": ["A. 完善制度建设，规范管理服务", "B. 加大工作力度，拓展覆盖范围", "C. 加强基础管理，确保鉴定质量", "D. 整体推动，协调发展"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第91-95页（纸质印刷码·85-89·）文件12《深化技能人才评价制度改革意见》& 备考PPT第36页真题\n【检索原句】：“完善制度建设、加大推广力度、加强质量监管、整体协同推进是四大支柱措施。”\n【考点解析】：全省乃至国家深化改革措施涵盖制度建设、拓展覆盖、质量管理与协同发展全部四项。"}, {"id": 62, "type": "multi", "title": "职业技能鉴定/评价管理服务中心的工作职责包括（   ）", "options": ["A. 监督管理", "B. 命题管理", "C. 考务工作", "D. 机构人事任免"], "answer": ["A", "B", "C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第98-102页（纸质印刷码·92-96·）文件13《机构管理办法》& 备考PPT第37页真题\n【检索原句】：“评价中心主要承担考务组织、命题管理、质量督导职责。”\n【考点解析】：考务、命题、监督管理属于其法定职权；机构人事任免属于行政主管职能，选ABC。"}, {"id": 63, "type": "multi", "title": "考评人员在现场考评工作中的工作守则包括（   ）", "options": ["A. 佩戴考评人员有效证件上岗", "B. 不得携带和使用手机等通讯工具", "C. 严格按评分标准独立打分，不得打人情分", "D. 遇到亲属或带教学员主动提出回避"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第269-271页（纸质印刷码·263-265·）文件22《考评人员管理办法》第二十二至二十五条\n【检索原句】：“挂牌上岗、严管通讯、独立执规、主动回避”四项均为现场考评核心守则。\n【考点解析】：考评守则四大纪律要求全部正确，必须全选。"}, {"id": 64, "type": "multi", "title": "养老护理员实践技能指导中，常用的六大教学方法包括（   ）", "options": ["A. 引导式教学法", "B. 对比教学法", "C. 角色扮演法", "D. 图示讲解法与小结法"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第7-8页【专业笔答必背真题】）\n【复习提示】：此题来源于官方课件下午笔答标准答案，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记该真题标准答案即可。\n【考点解析】：官方标准答案涵盖六大方法：引导式教学法、理论授课法、对比教学法、角色扮演法、图示讲解法、小结法。"}, {"id": 65, "type": "multi", "title": "组织实施养老机构持续质量改进的注意事项有（   ）", "options": ["A. 计划应根据老年人的需求动态调整", "B. 组长、副组长对改进效果要正确确认", "C. 注重终末质量的同时更要注重过程管理、环节控制", "D. 方案一旦制定绝不允许调整"], "answer": ["A", "B", "C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第9页【专业笔答必背真题】）\n【复习提示】：此题来源于下午专业笔答第6题官方标答，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记该真题标准答案即可。\n【考点解析】：标答明确指出必须依据老人需求动态调整，院领导亲自确认，重在抓过程与环节质控，D项绝对化表述错误。"}, {"id": 66, "type": "multi", "title": "考评人员在进行实操考评时，发生下列哪些行为属于严重违规（   ）", "options": ["A. 擅自更改考场评分标准", "B. 与考生串通舞弊、暗示答案", "C. 评分表漏签字且未核实分数", "D. 涂改分数后拒绝本人签字确认"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第272-273页（纸质印刷码·266-267·）文件22《考评人员管理办法》第二十九、三十条\n【检索原句】：“私改标准、舞弊泄题、评分不审、涂改拒签均属于严重违纪违规行为。”\n【考点解析】：违反独立、公平考评原则或评分表造假，直接判定违规并面临记分停聘。"}, {"id": 67, "type": "multi", "title": "关于国家“新八级工”制度，下列属于高级工以上的高技能人才层级有（   ）", "options": ["A. 技师", "B. 高级技师", "C. 特级技师", "D. 首席技师"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第16页（纸质印刷码·10·第5-14行）文件2（人社部发〔2022〕14号）\n【检索原句】：“高级工以上梯队设技师、高级技师、特级技师、首席技师。”\n【考点解析】：四者均属于高级工之上的高技能人才层级，全部正确。"}, {"id": 68, "type": "multi", "title": "在进行老年人能力评估时，主要评估的核心一级指标包括（   ）", "options": ["A. 日常生活活动能力", "B. 精神状态", "C. 感知觉与沟通", "D. 社会参与能力"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》 ）\n【复习提示】：此题来源于下午实操“视频打分”考务硬指标，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记该真题标准答案即可。\n【考点解析】：官方课件六大硬指标全部满足，分差不超5分、准确率2/3、蓝黑笔、涂改亲笔签字。"}, {"id": 80, "type": "multi", "title": "【应用拓展】职业技能等级认定工作坚持的基本原则包括（   ）", "options": ["A. 科学客观", "B. 公平公正", "C. 规范有序", "D. 谁评价谁负责"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第56页（纸质印刷码·50·第1-15行）文件6《工作规程》第二条\n【检索原句】：“职业技能等级认定坚持科学、客观、公平、公正、规范、谁评价谁负责的原则。”\n【考点解析】：职业技能等级认定的六大原则全面体现了主体责任与规范要求。"}]}, {"id": 7, "name": "全真模考大卷 07", "total_questions": 80, "questions": [{"id": 1, "type": "single", "title": "鉴定比重的依据是（   ）", "options": ["A. 职业活动内容", "B. 鉴定工种的内容", "C. 国家职业标准", "D. 职业工作流程"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第30页（纸质印刷码·24·第8-16行）文件4《命题技术规程》第七条 & 备考PPT第16页真题\n【检索原句】：“评价考核各模块及考点的比重表，严格依据国家职业技能标准中各等级权重比重表确定。”\n【考点解析】：命题比重的直接法规依据即为国家职业标准。"}, {"id": 2, "type": "single", "title": "《中华人民共和国职业分类大典（2022年版）》将我国职业划分为（   ）个大类。", "options": ["A. 8", "B. 12", "C. 13", "D. 15"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第113页（纸质印刷码·107·第1-12行）文件14 & 备考PPT第29页真题\n【检索原句】：“2022年版《大典》共划分为8个大类、79个中类、449个小类、1639个细类（职业）。”\n【考点解析】：我国职业分类共有 8 个大类，此为常考数字通识点。"}, {"id": 3, "type": "single", "title": "技能人才评价试题在正式启用前，在保密管理上属于（   ）", "options": ["A. 普通内部资料", "B. 商业秘密", "C. 秘密级或机密级国家秘密", "D. 可以公开信息"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第42页（纸质印刷码·36·第1-20行）文件4《命题技术规程》第二十八条\n【检索原句】：“技能人才评价试题、试卷及评分标准在启用前属于国家秘密，按保密规定分为秘密级或机密级管理。”\n【考点解析】：考前试题严禁任何形式泄露，触犯保密法按刑法追究泄密责任。"}, {"id": 4, "type": "single", "title": "社会培训评价组织按照若干原则面向社会开展职业技能等级认定，《职业技能等级认定工作规程（试行）》明确的原则是（   ）", "options": ["A. 系统化原则", "B. 社会化原则", "C. 专业化原则", "D. 市场化原则"], "answer": ["D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第56页（纸质印刷码·50·第10-18行）文件6《职业技能等级认定工作规程》第二条 & 备考PPT第18页真题\n【检索原句】：“社会培训评价组织按照市场化、社会化、专业化原则，面向社会开展职业技能等级认定。”\n【考点解析】：社培评价组织以市场需求为导向，题干考查的是首要的市场化原则。"}, {"id": 5, "type": "single", "title": "企业内员工职业技能等级认定实行的是（   ）管理。", "options": ["A. 社会化", "B. 企业化", "C. 标准化", "D. 市场化"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第57页（纸质印刷码·51·第5-15行）文件6《工作规程》第四条 & 备考PPT第21页真题\n【检索原句】：“用人单位开展技能等级认定实行企业化管理，自主设立评价岗位、自主制定标准、自主开展考评并颁发证书。”\n【考点解析】：企业内部认定区别于社会化评价，属于“企业化”自主管理体系。"}, {"id": 6, "type": "single", "title": "技能人才评价纸质考务资料和现场音视频监控记录，法定保存期限一般不少于（   ）年。", "options": ["A. 1年", "B. 2年", "C. 3年", "D. 10年"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第60页（纸质印刷码·54·第15-22行）文件6《工作规程》第三十条及第346页第四十二条\n【检索原句】：“评价机构应建立评价全过程台账，试卷、考务记录及现场音视频监控资料保存期限不少于3年。”\n【考点解析】：技能评价考务档案留存法定红线年限为 3 年。"}, {"id": 7, "type": "single", "title": "关于职业技能等级证书查询上网，下列说法正确的是（   ）", "options": ["A. 评价机构自行在内网查询即可", "B. 证书数据经审核后上传至全国技能人才评价证书全国联网查询系统", "C. 只有本省系统能查", "D. 不需要上网查询"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第73-77页（纸质印刷码·67-71·）文件8、文件9《证书数据工作指南》\n【检索原句】：“证书数据经省中心汇总审核后统一上传至技能人才评价工作网（osta.org.cn），实现全国联网一网通查。”\n【考点解析】：职业技能等级证书具有国家公信力，统一在人社部官方联网系统查询。"}, {"id": 8, "type": "single", "title": "强化职业责任是（   ）职业道德规范的具体要求。", "options": ["A. 团结协作", "B. 诚实守信", "C. 勤劳节约", "D. 爱岗敬业"], "answer": ["D"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第19页经典真题）\n【复习提示】：此题来源于备课PPT第19页职业道德经典真题，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：爱岗敬业的三个层次具体要求为：树立崇高职业理想、强化职业岗位责任、持续提升职业操作技能。"}, {"id": 9, "type": "single", "title": "养老机构持续质量改进领导小组的组长应当由（   ）担任。", "options": ["A. 护理部主任", "B. 质控科长", "C. 院长", "D. 社区代表"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第9页【专业笔答必背真题】）\n【复习提示】：此题来源于官方备课PPT第9页实操笔答标答，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：官方标准答案明确规定：“成立持续质量改进领导小组：由院长担任组长，各分管院长任副组长，组员为各部门主任、副主任；明确层级责任制。”"}, {"id": 10, "type": "single", "title": "协助偏瘫老年人从床转移到轮椅时，轮椅应放置在老年人的（   ）", "options": ["A. 患侧，与床成90度", "B. 健侧，与床呈30度~45度", "C. 患侧，与床呈30度~45度", "D. 正后方"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第6页、第13页及养老护理员实操考评规范）\n【复习提示】：此题来源于实操专业技能考核细则，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：床椅转移黄金法则：轮椅置于健侧（有力侧），与床呈30°~45°夹角，翻起脚踏板并必须双侧刹车锁死。"}, {"id": 11, "type": "single", "title": "在转移老年人前，护理员检查轮椅的首要安全动作是（   ）", "options": ["A. 擦拭椅面", "B. 调整椅背", "C. 锁死双侧刹车制动器", "D. 放下安全带"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页、第6页打分细则）\n【复习提示】：此题来源于养老护理员实操防扣分规范，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：转移防跌倒第一生命线是刹车制动，未刹车转移在全省考评标准中直接判定为重大安全缺陷扣除大项分。"}, {"id": 12, "type": "single", "title": "为失智老年人进行行为访谈法评估时，若老人情绪激动出现敌对猜疑，评估员最恰当的反应是（   ）", "options": ["A. 严厉批评其不配合", "B. 立即终止评估并判定其0分", "C. 保持耐心，停止引起刺激的话题，给予心理支持与安抚", "D. 强行按住老人继续提问"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第10-12页【行为访谈评估规范】）\n【复习提示】：此题来源于官方课件实操考核采分点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：考评要点明确强调人文关怀素养：“能针对心理情绪做出恰当反应，给予支持，绝不可急躁，有尊老护老意识。”"}, {"id": 13, "type": "single", "title": "护理员协助老年人进行体位转换时，最符合人体力学（节力原则）的操作是（   ）", "options": ["A. 护理员双脚并拢，直立弯腰用力", "B. 护理员双脚前后开立、屈膝下蹲、降低重心", "C. 单手用力拉扯老人肢体", "D. 仅靠手臂力量搬运"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第5页、第14页实践指导人体力学考评点）\n【复习提示】：此题来源于实践教学指导考点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：双脚前后开立增加支撑底面积，屈膝下蹲降低重心，利用下肢大肌群做功保护腰肌。"}, {"id": 14, "type": "single", "title": "老年人从床转移至轮椅就座后，脚踏板与身体位置的规范调整是（   ）", "options": ["A. 双脚垂在半空", "B. 将双侧脚踏板放下，双足平稳置于踏板上，系好安全带", "C. 脚踏板继续翻起", "D. 让老人单脚悬空"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第6页实操细则）\n【复习提示】：此题来源于实操防扣分采分点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：就座后必须放平踏板双脚踏稳，系好安全腰带，拉好衣角保暖，询问老人舒适度。"}, {"id": 15, "type": "single", "title": "“新八级工”职业技能等级序列中，最高的层级是（   ）", "options": ["A. 高级技师", "B. 特级技师", "C. 首席技师", "D. 技能大师"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第16页（纸质印刷码·10·第8-14行）文件2（人社部发〔2022〕14号）\n【检索原句】：“新八级工序列为：学徒工、初级工、中级工、高级工、技师、高级技师、特级技师、首席技师。”\n【考点解析】：首席技师为最高技术层级，属于高技能领军人才。"}, {"id": 16, "type": "single", "title": "到“十四五”时期末，东部省份高技能人才占技能人才的比例力争达到（   ）", "options": ["A. 25%", "B. 30%", "C. 35%", "D. 50%"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第8页（纸质印刷码·2·第173-176行）文件1（中办发〔2022〕58号文件）\n【检索原句】：“技能人才占就业人员比例达到30%以上，高技能人才占技能人才比例达到1/3，东部省份高技能人才占技能人才比例达到35%。”\n【考点解析】：东部沿海省份（如浙江）目标比例定为 35%。"}, {"id": 17, "type": "single", "title": "高技能人才与工程技术、农业技术等专业技术人才贯通发展中，高级工对应申报的专业技术职称是（   ）", "options": ["A. 技术员", "B. 助理工程师", "C. 工程师", "D. 高级工程师"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第151-155页（纸质印刷码·145-149·）文件17《高技能人才与专业技术人才贯通实施办法》\n【检索原句】：“高级工对应助理级职称，技师对应中级职称，高级技师对应副高级职称。”\n【考点解析】：高级工申报助理工程师（初级职称），陈老师作为副高护师，可指导技师对应副高级的贯通评价。"}, {"id": 18, "type": "single", "title": "考评人员资格证（卡）的有效期限为（   ）年。", "options": ["A. 1年", "B. 2年", "C. 3年", "D. 5年"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第268页（纸质印刷码·262·第4-6行）《浙江省技能人才评价考评人员管理办法（试行）》（浙技评〔2021〕22号）第十三条\n【检索原句】：“考评人员证卡由评价机构统一印制发放……有效期为三年，其有效期按证卡标注日期计算。有效期满前3个月须申请复训换证。”\n【考点解析】：考评人员证卡有效期与记分周期均为三年（亦见第271页第二十八条）。"}, {"id": 19, "type": "single", "title": "现场实操考评时，每个考评小组的考评人员人数必须为（   ）", "options": ["A. 偶数，不少于2人", "B. 单数，不少于3人", "C. 单数，不少于5人", "D. 任意人数"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第270-271页（纸质印刷码·264-265·）文件22《考评人员管理办法》第二十三条、第二十四条及第59页第二十二条\n【检索原句】：“考评人员一般应配备3人（含）以上单数……原则上每位考生每道操作技能考核试题由不少于3名考评人员独立评分；每个考评小组一般由3人以上单数组成，设组长1名。”\n【考点解析】：实操评分必须保证考评员为3人及以上奇数单数，独立评分，避免偶数票平局。"}, {"id": 20, "type": "single", "title": "考评员在考评过程中发现考生与自己有夫妻、直系血亲或近三年直接带教关系的，应当（   ）", "options": ["A. 照常考评，但评分从严", "B. 照常考评，但给予照顾", "C. 主动申请回避", "D. 由其他考评员代替签名"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第271页（纸质印刷码·265·第7-9行）文件22《考评人员管理办法》第二十五条\n【检索原句】：“第二十五条 考评人员实行回避制。执行考评任务时，考评人员与考生存在亲属、朋友、师生、师徒及利害关系的，应主动申请回避……”\n【考点解析】：回避制度是保证公平公正的铁律，考评员知晓利害关系后必须主动提出回避。"}, {"id": 21, "type": "single", "title": "考评人员在实操评分时，评分表涂改处的规范处置方法是（   ）", "options": ["A. 用涂改液覆盖修改", "B. 划掉后在旁边写上新数字并由本人签名确认", "C. 用橡皮擦干净后重写", "D. 重新换一张新表抄写"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第270页（纸质印刷码·264·第193-194行）文件22《考评人员管理办法》第二十三条 及 备考PPT第3页\n【检索原句】：“评分过程应全程记录，不得随意涂改。评分结果应真实有效，每名考评人员须按要求对评分过程和结果签字确认。”\n【考点解析】：涂改处必须由本人在修改处旁亲笔签名确认，严禁使用涂改液、修正带或他人代签。"}, {"id": 22, "type": "single", "title": "考评员实施考评打分时，书写工具必须使用（   ）", "options": ["A. 红色圆珠笔", "B. 铅笔", "C. 蓝黑墨水笔或黑色签字笔", "D. 任意彩色水笔"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页【考评技术规范】）\n【复习提示】：此题来源于官方课件实操技术考核硬指标，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记该真题考点即可。\n【考点解析】：官方课件规定考务打分硬指标：“（6）字迹：字迹清楚，必须使用蓝黑水笔或黑色签字笔书写；红笔（仅复核用）、铅笔、圆珠笔均判定为不合格废卷。”"}, {"id": 23, "type": "single", "title": "视频模拟打分考核中，考生评分与标准考评员分数误差应控制在（   ）以内。", "options": ["A. 3分", "B. 5分", "C. 10分", "D. 15分"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页【考评技术考核要求】）\n【复习提示】：此题来源于下午实操“视频打分”的核心采分指标，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：实操考评技术硬性考核指标明确规定：“（1）考评分数：考生打分与考评员分数误差不大于5分；（2）打分准确率达到2/3以上；（3）总分核算准确无误。”"}, {"id": 24, "type": "single", "title": "同一组考评人员连续在同一考点承担考评任务，一般不得超过（   ）次。", "options": ["A. 1次", "B. 2次", "C. 3次", "D. 5次"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第271页（纸质印刷码·265·第1-3行）文件22《考评人员管理办法》第二十四条\n【检索原句】：“考评人员不得连续 3 次承担考评任务。”\n【考点解析】：根据法理逻辑，“不得连续3次”即合法合规出勤上限为“最多不得超过2次”，题干问的是不得超过几次，故上限填2次。"}, {"id": 25, "type": "single", "title": "考评人员在考评现场必须严格遵守的纪律，下列描述错误的是（   ）", "options": ["A. 佩戴有效证件上岗", "B. 考评期间关闭通讯工具并集中保管", "C. 独立打分，不得互相串通", "D. 可以为未完成操作的熟人考生延长时间"], "answer": ["D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第269-270页（纸质印刷码·263-264·第18-28行）文件22《考评人员管理办法》第二十二条\n【检索原句】：“严格执行考场纪律，严禁私自为考生延长时间、通融照顾或泄露试题，违者严肃追责。”\n【考点解析】：考场上任何私自延时、泄题或打人情分行为均属于严重违反考风考纪。"}, {"id": 26, "type": "single", "title": "考评人员因徇私舞弊、滥用职权受到取消考评人员资格处理的，人社部门将（   ）", "options": ["A. 暂停考评资格半年", "B. 扣减当年津贴", "C. 列入黑名单，终身不得再聘", "D. 给予口头批评"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（全国/往届考评员统一机考经典真题）\n【复习提示】：此题来源于全国考评员统考历年真题，选项答案“列入黑名单，终身不得再聘”属于传统老题库标准答案，未在浙江省 349 页政策汇编中收录原话，无需在 PDF 中检索，刷题时直接识记该真题标准答案即可。\n【法条延伸】：若在浙江省现行最新规章试题中（见《学习资料.pdf》第271页第二十八条、第283页附件4第5条），浙江现行法定规范表述为：“取消考评资格，三年内不得重新申报”。"}, {"id": 27, "type": "single", "title": "关于考评组长职责的描述，下列哪项是不正确的（   ）", "options": ["A. 负责考评组现场考评的组织协调", "B. 主持现场评分分歧的评议", "C. 独立决定考生成绩并强行要求其他考评员服从", "D. 负责汇总并审核全组成绩与签字"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第271页（纸质印刷码·265·第10-14行）文件22《考评人员管理办法》第二十六条\n【检索原句】：“每次考评指派考评组长1名，全面负责本次考评工作的组织与协调，并最终裁决有争议的技术问题……”\n【考点解析】：评分遵循考评员独立打分制，组长负责现场统筹与技术分歧裁决，但不得强行命令或修改其他考评员的分数。"}, {"id": 28, "type": "single", "title": "“双随机、一公开”的双随机是指在监督过程中（   ）", "options": ["A. 随机抽取检查对象，随机选派执法检查人员", "B. 随机抽取检查项目，随机选派执法检查人员", "C. 随机抽取检查内容，随机选派执法检查人员", "D. 随机抽取检查地点，随机选派执法检查人员"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第65页（纸质印刷码·59·第12-16行）文件7《质量督导工作规程》第十条 & 备考PPT第20页真题\n【检索原句】：“完善‘双随机、一公开’监管机制，即在监督过程中随机抽取检查对象，随机选派执法检查人员，及时向社会公开抽查结果。”\n【考点解析】：双随机即“随机抽取对象、随机选派检查人员”。"}, {"id": 29, "type": "single", "title": "技能人才评价质量督导员在考场实施督导时，享有的职权不包括（   ）", "options": ["A. 巡视检查权", "B. 纠正违规权", "C. 如实报告权", "D. 擅自改变考生成绩权"], "answer": ["D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第64-65页（纸质印刷码·58-59·第14-25行）文件7《质量督导工作规程》第九条\n【检索原句】：“质量督导员对评价活动全过程实施巡视、纠偏，并如实报告督导情况……”\n【考点解析】：督导员具有“巡视、纠偏、如实报告”三大基本职权，但无权擅自评定、更改或宣布考生成绩无效。"}, {"id": 30, "type": "single", "title": "质量督导人员对技能人才评价活动实施日常督导的主要方式是（   ）", "options": ["A. 查阅台账、现场巡视与远程视频抽查", "B. 替考生答题", "C. 协助考评员打分", "D. 组织考前辅导"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第63页（纸质印刷码·57·第18-30行）文件7《质量督导工作规程》第六条\n【检索原句】：“督导员采取查阅考务台账、实地巡视考场及依托监控平台远程视频抽查方式开展全流程督导。”\n【考点解析】：规范的督导方式为查阅考务资料台账、现场实地巡视与远程监控视频抽查。"}, {"id": 31, "type": "single", "title": "对职业技能等级认定机构进行年度质量督导评估时，重点评估的内容是（   ）", "options": ["A. 机构盈利情况", "B. 规章制度执行、考评质量与考务规范落实情况", "C. 广告宣传投入", "D. 职工人数规模"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第66页（纸质印刷码·60·第8-22行）文件7《质量督导工作规程》第十四条\n【检索原句】：“重点评估规章制度建设、认定工作规范、考评质量控制、档案管理及社会评价认可度等内容。”\n【考点解析】：评估重心在于制度健全度、考评规范性与质量管理，与经济盈利无关。"}, {"id": 32, "type": "single", "title": "技能人才评价活动结束后，发现考场存在严重组织作弊的，质量督导员应当（   ）", "options": ["A. 私下协商解决", "B. 隐瞒不报", "C. 及时固定音视频等证据，向人社评价管理部门提交专项督导报告", "D. 直接罚款"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第67页（纸质印刷码·61·第1-15行）文件7《质量督导工作规程》第十六条及第328页第二十条\n【检索原句】：“发现严重作弊或重大违纪违规行为的，督导员应及时收集固定相关证据，如实记录并提交专项督导报告。”\n【考点解析】：遇严重舞弊必须第一时间固定证据、形成书面专项报告并按程序上报，督导员个人无直接行政处罚罚款权。"}, {"id": 33, "type": "single", "title": "国家职业技能标准的核心内容是（   ）", "options": ["A. 职业概况", "B. 工作要求", "C. 比重表", "D. 基本要求"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第29页（纸质印刷码·23·第15-28行）文件4《命题技术规程》第五条 & 备考PPT第23页真题\n【检索原句】：“国家职业技能标准由职业概况、基本要求、工作要求和权重表四个部分组成。其中，‘工作要求’是标准的核心主体。”\n【考点解析】：工作要求明确了各等级从业人员应具备的技能要求和相关知识，是考核考评的根本依据。"}, {"id": 34, "type": "single", "title": "国家职业标准制定的基本原则是（   ）", "options": ["A. 整体性、等级性、职称性、实用性", "B. 整体性、职称、规范性、实用性", "C. 整体性、等级性、规范性、实用性", "D. 可操作性、时效性、永久性并存原则"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第118页（纸质印刷码·112·第1-10行）文件14《职业技能标准开发管理办法》& 备考PPT第35页真题\n【检索原句】：“国家职业技能标准的编制应遵循整体性、等级性、规范性、实用性的原则。”\n【考点解析】：四大原则必须牢记：整体性、等级性、规范性、实用性（职称性、永久性均为干扰项）。"}, {"id": 35, "type": "single", "title": "试题的四个关键质量指标（三度一效）是指（   ）", "options": ["A. 难度、区分度、信度、效度", "B. 深度、宽度、广度、效度", "C. 难度、知名度、信度、满意度", "D. 区分度、灵敏度、透明度、信度"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第44页（纸质印刷码·38·第14-16行）文件4《技能人才评价命题技术规程（试行）》第四部分第4.7条\n【检索原句】：“正式试卷使用后，可运用现代测评理论进行统计分析，估计题目难度、区分度和公平性，以及考评的信度和效度等，为后续改进试题试卷提供参考。”\n【考点解析】：规程第四部分第4.7条法定测评指标包括“难度、区分度、公平性、信度、效度”。在命题理论中，业内通称为“三度一效”（三度：难度、区分度、信度；一效：效度）。"}, {"id": 36, "type": "single", "title": "鉴定比重的依据是（   ）", "options": ["A. 职业活动内容", "B. 鉴定工种的内容", "C. 国家职业标准", "D. 职业工作流程"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第30页（纸质印刷码·24·第8-16行）文件4《命题技术规程》第七条 & 备考PPT第16页真题\n【检索原句】：“评价考核各模块及考点的比重表，严格依据国家职业技能标准中各等级权重比重表确定。”\n【考点解析】：命题比重的直接法规依据即为国家职业标准。"}, {"id": 37, "type": "single", "title": "《中华人民共和国职业分类大典（2022年版）》将我国职业划分为（   ）个大类。", "options": ["A. 8", "B. 12", "C. 13", "D. 15"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第113页（纸质印刷码·107·第1-12行）文件14 & 备考PPT第29页真题\n【检索原句】：“2022年版《大典》共划分为8个大类、79个中类、449个小类、1639个细类（职业）。”\n【考点解析】：我国职业分类共有 8 个大类，此为常考数字通识点。"}, {"id": 38, "type": "single", "title": "技能人才评价试题在正式启用前，在保密管理上属于（   ）", "options": ["A. 普通内部资料", "B. 商业秘密", "C. 秘密级或机密级国家秘密", "D. 可以公开信息"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第42页（纸质印刷码·36·第1-20行）文件4《命题技术规程》第二十八条\n【检索原句】：“技能人才评价试题、试卷及评分标准在启用前属于国家秘密，按保密规定分为秘密级或机密级管理。”\n【考点解析】：考前试题严禁任何形式泄露，触犯保密法按刑法追究泄密责任。"}, {"id": 39, "type": "single", "title": "社会培训评价组织按照若干原则面向社会开展职业技能等级认定，《职业技能等级认定工作规程（试行）》明确的原则是（   ）", "options": ["A. 系统化原则", "B. 社会化原则", "C. 专业化原则", "D. 市场化原则"], "answer": ["D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第56页（纸质印刷码·50·第10-18行）文件6《职业技能等级认定工作规程》第二条 & 备考PPT第18页真题\n【检索原句】：“社会培训评价组织按照市场化、社会化、专业化原则，面向社会开展职业技能等级认定。”\n【考点解析】：社培评价组织以市场需求为导向，题干考查的是首要的市场化原则。"}, {"id": 40, "type": "single", "title": "企业内员工职业技能等级认定实行的是（   ）管理。", "options": ["A. 社会化", "B. 企业化", "C. 标准化", "D. 市场化"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第57页（纸质印刷码·51·第5-15行）文件6《工作规程》第四条 & 备考PPT第21页真题\n【检索原句】：“用人单位开展技能等级认定实行企业化管理，自主设立评价岗位、自主制定标准、自主开展考评并颁发证书。”\n【考点解析】：企业内部认定区别于社会化评价，属于“企业化”自主管理体系。"}, {"id": 41, "type": "single", "title": "【综合案例】技能人才评价纸质考务资料和现场音视频监控记录，法定保存期限一般不少于（   ）年。", "options": ["A. 1年", "B. 2年", "C. 3年", "D. 10年"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第60页（纸质印刷码·54·第15-22行）文件6《工作规程》第三十条及第346页第四十二条\n【检索原句】：“评价机构应建立评价全过程台账，试卷、考务记录及现场音视频监控资料保存期限不少于3年。”\n【考点解析】：技能评价考务档案留存法定红线年限为 3 年。"}, {"id": 42, "type": "single", "title": "【综合案例】关于职业技能等级证书查询上网，下列说法正确的是（   ）", "options": ["A. 评价机构自行在内网查询即可", "B. 证书数据经审核后上传至全国技能人才评价证书全国联网查询系统", "C. 只有本省系统能查", "D. 不需要上网查询"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第73-77页（纸质印刷码·67-71·）文件8、文件9《证书数据工作指南》\n【检索原句】：“证书数据经省中心汇总审核后统一上传至技能人才评价工作网（osta.org.cn），实现全国联网一网通查。”\n【考点解析】：职业技能等级证书具有国家公信力，统一在人社部官方联网系统查询。"}, {"id": 43, "type": "single", "title": "【综合案例】强化职业责任是（   ）职业道德规范的具体要求。", "options": ["A. 团结协作", "B. 诚实守信", "C. 勤劳节约", "D. 爱岗敬业"], "answer": ["D"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第19页经典真题）\n【复习提示】：此题来源于备课PPT第19页职业道德经典真题，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：爱岗敬业的三个层次具体要求为：树立崇高职业理想、强化职业岗位责任、持续提升职业操作技能。"}, {"id": 44, "type": "single", "title": "【综合案例】养老机构持续质量改进领导小组的组长应当由（   ）担任。", "options": ["A. 护理部主任", "B. 质控科长", "C. 院长", "D. 社区代表"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第9页【专业笔答必背真题】）\n【复习提示】：此题来源于官方备课PPT第9页实操笔答标答，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：官方标准答案明确规定：“成立持续质量改进领导小组：由院长担任组长，各分管院长任副组长，组员为各部门主任、副主任；明确层级责任制。”"}, {"id": 45, "type": "single", "title": "【综合案例】协助偏瘫老年人从床转移到轮椅时，轮椅应放置在老年人的（   ）", "options": ["A. 患侧，与床成90度", "B. 健侧，与床呈30度~45度", "C. 患侧，与床呈30度~45度", "D. 正后方"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第6页、第13页及养老护理员实操考评规范）\n【复习提示】：此题来源于实操专业技能考核细则，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：床椅转移黄金法则：轮椅置于健侧（有力侧），与床呈30°~45°夹角，翻起脚踏板并必须双侧刹车锁死。"}, {"id": 46, "type": "single", "title": "【综合案例】在转移老年人前，护理员检查轮椅的首要安全动作是（   ）", "options": ["A. 擦拭椅面", "B. 调整椅背", "C. 锁死双侧刹车制动器", "D. 放下安全带"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页、第6页打分细则）\n【复习提示】：此题来源于养老护理员实操防扣分规范，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：转移防跌倒第一生命线是刹车制动，未刹车转移在全省考评标准中直接判定为重大安全缺陷扣除大项分。"}, {"id": 47, "type": "single", "title": "【综合案例】为失智老年人进行行为访谈法评估时，若老人情绪激动出现敌对猜疑，评估员最恰当的反应是（   ）", "options": ["A. 严厉批评其不配合", "B. 立即终止评估并判定其0分", "C. 保持耐心，停止引起刺激的话题，给予心理支持与安抚", "D. 强行按住老人继续提问"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第10-12页【行为访谈评估规范】）\n【复习提示】：此题来源于官方课件实操考核采分点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：考评要点明确强调人文关怀素养：“能针对心理情绪做出恰当反应，给予支持，绝不可急躁，有尊老护老意识。”"}, {"id": 48, "type": "single", "title": "【综合案例】护理员协助老年人进行体位转换时，最符合人体力学（节力原则）的操作是（   ）", "options": ["A. 护理员双脚并拢，直立弯腰用力", "B. 护理员双脚前后开立、屈膝下蹲、降低重心", "C. 单手用力拉扯老人肢体", "D. 仅靠手臂力量搬运"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第5页、第14页实践指导人体力学考评点）\n【复习提示】：此题来源于实践教学指导考点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：双脚前后开立增加支撑底面积，屈膝下蹲降低重心，利用下肢大肌群做功保护腰肌。"}, {"id": 49, "type": "single", "title": "【综合案例】老年人从床转移至轮椅就座后，脚踏板与身体位置的规范调整是（   ）", "options": ["A. 双脚垂在半空", "B. 将双侧脚踏板放下，双足平稳置于踏板上，系好安全带", "C. 脚踏板继续翻起", "D. 让老人单脚悬空"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第6页实操细则）\n【复习提示】：此题来源于实操防扣分采分点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：就座后必须放平踏板双脚踏稳，系好安全腰带，拉好衣角保暖，询问老人舒适度。"}, {"id": 50, "type": "single", "title": "【综合案例】“新八级工”职业技能等级序列中，最高的层级是（   ）", "options": ["A. 高级技师", "B. 特级技师", "C. 首席技师", "D. 技能大师"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第16页（纸质印刷码·10·第8-14行）文件2（人社部发〔2022〕14号）\n【检索原句】：“新八级工序列为：学徒工、初级工、中级工、高级工、技师、高级技师、特级技师、首席技师。”\n【考点解析】：首席技师为最高技术层级，属于高技能领军人才。"}, {"id": 51, "type": "single", "title": "【综合案例】到“十四五”时期末，东部省份高技能人才占技能人才的比例力争达到（   ）", "options": ["A. 25%", "B. 30%", "C. 35%", "D. 50%"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第8页（纸质印刷码·2·第173-176行）文件1（中办发〔2022〕58号文件）\n【检索原句】：“技能人才占就业人员比例达到30%以上，高技能人才占技能人才比例达到1/3，东部省份高技能人才占技能人才比例达到35%。”\n【考点解析】：东部沿海省份（如浙江）目标比例定为 35%。"}, {"id": 52, "type": "single", "title": "【综合案例】高技能人才与工程技术、农业技术等专业技术人才贯通发展中，高级工对应申报的专业技术职称是（   ）", "options": ["A. 技术员", "B. 助理工程师", "C. 工程师", "D. 高级工程师"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第151-155页（纸质印刷码·145-149·）文件17《高技能人才与专业技术人才贯通实施办法》\n【检索原句】：“高级工对应助理级职称，技师对应中级职称，高级技师对应副高级职称。”\n【考点解析】：高级工申报助理工程师（初级职称），陈老师作为副高护师，可指导技师对应副高级的贯通评价。"}, {"id": 53, "type": "single", "title": "【综合案例】考评人员资格证（卡）的有效期限为（   ）年。", "options": ["A. 1年", "B. 2年", "C. 3年", "D. 5年"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第268页（纸质印刷码·262·第4-6行）《浙江省技能人才评价考评人员管理办法（试行）》（浙技评〔2021〕22号）第十三条\n【检索原句】：“考评人员证卡由评价机构统一印制发放……有效期为三年，其有效期按证卡标注日期计算。有效期满前3个月须申请复训换证。”\n【考点解析】：考评人员证卡有效期与记分周期均为三年（亦见第271页第二十八条）。"}, {"id": 54, "type": "single", "title": "【综合案例】现场实操考评时，每个考评小组的考评人员人数必须为（   ）", "options": ["A. 偶数，不少于2人", "B. 单数，不少于3人", "C. 单数，不少于5人", "D. 任意人数"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第270-271页（纸质印刷码·264-265·）文件22《考评人员管理办法》第二十三条、第二十四条及第59页第二十二条\n【检索原句】：“考评人员一般应配备3人（含）以上单数……原则上每位考生每道操作技能考核试题由不少于3名考评人员独立评分；每个考评小组一般由3人以上单数组成，设组长1名。”\n【考点解析】：实操评分必须保证考评员为3人及以上奇数单数，独立评分，避免偶数票平局。"}, {"id": 55, "type": "single", "title": "【综合案例】考评员在考评过程中发现考生与自己有夫妻、直系血亲或近三年直接带教关系的，应当（   ）", "options": ["A. 照常考评，但评分从严", "B. 照常考评，但给予照顾", "C. 主动申请回避", "D. 由其他考评员代替签名"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第271页（纸质印刷码·265·第7-9行）文件22《考评人员管理办法》第二十五条\n【检索原句】：“第二十五条 考评人员实行回避制。执行考评任务时，考评人员与考生存在亲属、朋友、师生、师徒及利害关系的，应主动申请回避……”\n【考点解析】：回避制度是保证公平公正的铁律，考评员知晓利害关系后必须主动提出回避。"}, {"id": 56, "type": "single", "title": "【综合案例】考评人员在实操评分时，评分表涂改处的规范处置方法是（   ）", "options": ["A. 用涂改液覆盖修改", "B. 划掉后在旁边写上新数字并由本人签名确认", "C. 用橡皮擦干净后重写", "D. 重新换一张新表抄写"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第270页（纸质印刷码·264·第193-194行）文件22《考评人员管理办法》第二十三条 及 备考PPT第3页\n【检索原句】：“评分过程应全程记录，不得随意涂改。评分结果应真实有效，每名考评人员须按要求对评分过程和结果签字确认。”\n【考点解析】：涂改处必须由本人在修改处旁亲笔签名确认，严禁使用涂改液、修正带或他人代签。"}, {"id": 57, "type": "single", "title": "【综合案例】考评员实施考评打分时，书写工具必须使用（   ）", "options": ["A. 红色圆珠笔", "B. 铅笔", "C. 蓝黑墨水笔或黑色签字笔", "D. 任意彩色水笔"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页【考评技术规范】）\n【复习提示】：此题来源于官方课件实操技术考核硬指标，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记该真题考点即可。\n【考点解析】：官方课件规定考务打分硬指标：“（6）字迹：字迹清楚，必须使用蓝黑水笔或黑色签字笔书写；红笔（仅复核用）、铅笔、圆珠笔均判定为不合格废卷。”"}, {"id": 58, "type": "single", "title": "【综合案例】视频模拟打分考核中，考生评分与标准考评员分数误差应控制在（   ）以内。", "options": ["A. 3分", "B. 5分", "C. 10分", "D. 15分"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页【考评技术考核要求】）\n【复习提示】：此题来源于下午实操“视频打分”的核心采分指标，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：实操考评技术硬性考核指标明确规定：“（1）考评分数：考生打分与考评员分数误差不大于5分；（2）打分准确率达到2/3以上；（3）总分核算准确无误。”"}, {"id": 59, "type": "single", "title": "【综合案例】同一组考评人员连续在同一考点承担考评任务，一般不得超过（   ）次。", "options": ["A. 1次", "B. 2次", "C. 3次", "D. 5次"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第271页（纸质印刷码·265·第1-3行）文件22《考评人员管理办法》第二十四条\n【检索原句】：“考评人员不得连续 3 次承担考评任务。”\n【考点解析】：根据法理逻辑，“不得连续3次”即合法合规出勤上限为“最多不得超过2次”，题干问的是不得超过几次，故上限填2次。"}, {"id": 60, "type": "single", "title": "【综合案例】考评人员在考评现场必须严格遵守的纪律，下列描述错误的是（   ）", "options": ["A. 佩戴有效证件上岗", "B. 考评期间关闭通讯工具并集中保管", "C. 独立打分，不得互相串通", "D. 可以为未完成操作的熟人考生延长时间"], "answer": ["D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第269-270页（纸质印刷码·263-264·第18-28行）文件22《考评人员管理办法》第二十二条\n【检索原句】：“严格执行考场纪律，严禁私自为考生延长时间、通融照顾或泄露试题，违者严肃追责。”\n【考点解析】：考场上任何私自延时、泄题或打人情分行为均属于严重违反考风考纪。"}, {"id": 61, "type": "multi", "title": "考评人员在现场考评工作中的工作守则包括（   ）", "options": ["A. 佩戴考评人员有效证件上岗", "B. 不得携带和使用手机等通讯工具", "C. 严格按评分标准独立打分，不得打人情分", "D. 遇到亲属或带教学员主动提出回避"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第269-271页（纸质印刷码·263-265·）文件22《考评人员管理办法》第二十二至二十五条\n【检索原句】：“挂牌上岗、严管通讯、独立执规、主动回避”四项均为现场考评核心守则。\n【考点解析】：考评守则四大纪律要求全部正确，必须全选。"}, {"id": 62, "type": "multi", "title": "养老护理员实践技能指导中，常用的六大教学方法包括（   ）", "options": ["A. 引导式教学法", "B. 对比教学法", "C. 角色扮演法", "D. 图示讲解法与小结法"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第7-8页【专业笔答必背真题】）\n【复习提示】：此题来源于官方课件下午笔答标准答案，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记该真题标准答案即可。\n【考点解析】：官方标准答案涵盖六大方法：引导式教学法、理论授课法、对比教学法、角色扮演法、图示讲解法、小结法。"}, {"id": 63, "type": "multi", "title": "组织实施养老机构持续质量改进的注意事项有（   ）", "options": ["A. 计划应根据老年人的需求动态调整", "B. 组长、副组长对改进效果要正确确认", "C. 注重终末质量的同时更要注重过程管理、环节控制", "D. 方案一旦制定绝不允许调整"], "answer": ["A", "B", "C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第9页【专业笔答必背真题】）\n【复习提示】：此题来源于下午专业笔答第6题官方标答，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记该真题标准答案即可。\n【考点解析】：标答明确指出必须依据老人需求动态调整，院领导亲自确认，重在抓过程与环节质控，D项绝对化表述错误。"}, {"id": 64, "type": "multi", "title": "考评人员在进行实操考评时，发生下列哪些行为属于严重违规（   ）", "options": ["A. 擅自更改考场评分标准", "B. 与考生串通舞弊、暗示答案", "C. 评分表漏签字且未核实分数", "D. 涂改分数后拒绝本人签字确认"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第272-273页（纸质印刷码·266-267·）文件22《考评人员管理办法》第二十九、三十条\n【检索原句】：“私改标准、舞弊泄题、评分不审、涂改拒签均属于严重违纪违规行为。”\n【考点解析】：违反独立、公平考评原则或评分表造假，直接判定违规并面临记分停聘。"}, {"id": 65, "type": "multi", "title": "关于国家“新八级工”制度，下列属于高级工以上的高技能人才层级有（   ）", "options": ["A. 技师", "B. 高级技师", "C. 特级技师", "D. 首席技师"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第16页（纸质印刷码·10·第5-14行）文件2（人社部发〔2022〕14号）\n【检索原句】：“高级工以上梯队设技师、高级技师、特级技师、首席技师。”\n【考点解析】：四者均属于高级工之上的高技能人才层级，全部正确。"}, {"id": 66, "type": "multi", "title": "在进行老年人能力评估时，主要评估的核心一级指标包括（   ）", "options": ["A. 日常生活活动能力", "B. 精神状态", "C. 感知觉与沟通", "D. 社会参与能力"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第14页及评估国标 GB/T 42195-2022）\n【复习提示】：此题来源于官方课件专业笔答内容，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记该真题标准答案即可。\n【考点解析】：国家职业技能标准确立的4大一级指标正是：日常生活活动、精神状态、感知觉与沟通、社会参与。"}, {"id": 67, "type": "multi", "title": "考评人员在视频模拟打分时，必须严格达标的考务要求包括（   ）", "options": ["A. 分数与标准答案误差不大于5分", "B. 采分点判断准确率2/3以上", "C. 全程使用蓝黑墨水笔或黑色签字笔", "D. 涂改处由本人签字确认"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页【考评技术规范】）\ 六大原则全面体现了主体责任与规范要求。"}, {"id": 79, "type": "multi", "title": "【应用拓展】下列属于推行国家职业技能等级证书制度的主要措施有（   ）", "options": ["A. 完善制度建设，规范管理服务", "B. 加大工作力度，拓展覆盖范围", "C. 加强基础管理，确保鉴定质量", "D. 整体推动，协调发展"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第91-95页（纸质印刷码·85-89·）文件12《深化技能人才评价制度改革意见》& 备考PPT第36页真题\n【检索原句】：“完善制度建设、加大推广力度、加强质量监管、整体协同推进是四大支柱措施。”\n【考点解析】：全省乃至国家深化改革措施涵盖制度建设、拓展覆盖、质量管理与协同发展全部四项。"}, {"id": 80, "type": "multi", "title": "【应用拓展】职业技能鉴定/评价管理服务中心的工作职责包括（   ）", "options": ["A. 监督管理", "B. 命题管理", "C. 考务工作", "D. 机构人事任免"], "answer": ["A", "B", "C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第98-102页（纸质印刷码·92-96·）文件13《机构管理办法》& 备考PPT第37页真题\n【检索原句】：“评价中心主要承担考务组织、命题管理、质量督导职责。”\n【考点解析】：考务、命题、监督管理属于其法定职权；机构人事任免属于行政主管职能，选ABC。"}]}, {"id": 8, "name": "全真模考大卷 08", "total_questions": 80, "questions": [{"id": 1, "type": "single", "title": "社会培训评价组织按照若干原则面向社会开展职业技能等级认定，《职业技能等级认定工作规程（试行）》明确的原则是（   ）", "options": ["A. 系统化原则", "B. 社会化原则", "C. 专业化原则", "D. 市场化原则"], "answer": ["D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第56页（纸质印刷码·50·第10-18行）文件6《职业技能等级认定工作规程》第二条 & 备考PPT第18页真题\n【检索原句】：“社会培训评价组织按照市场化、社会化、专业化原则，面向社会开展职业技能等级认定。”\n【考点解析】：社培评价组织以市场需求为导向，题干考查的是首要的市场化原则。"}, {"id": 2, "type": "single", "title": "企业内员工职业技能等级认定实行的是（   ）管理。", "options": ["A. 社会化", "B. 企业化", "C. 标准化", "D. 市场化"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第57页（纸质印刷码·51·第5-15行）文件6《工作规程》第四条 & 备考PPT第21页真题\n【检索原句】：“用人单位开展技能等级认定实行企业化管理，自主设立评价岗位、自主制定标准、自主开展考评并颁发证书。”\n【考点解析】：企业内部认定区别于社会化评价，属于“企业化”自主管理体系。"}, {"id": 3, "type": "single", "title": "技能人才评价纸质考务资料和现场音视频监控记录，法定保存期限一般不少于（   ）年。", "options": ["A. 1年", "B. 2年", "C. 3年", "D. 10年"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第60页（纸质印刷码·54·第15-22行）文件6《工作规程》第三十条及第346页第四十二条\n【检索原句】：“评价机构应建立评价全过程台账，试卷、考务记录及现场音视频监控资料保存期限不少于3年。”\n【考点解析】：技能评价考务档案留存法定红线年限为 3 年。"}, {"id": 4, "type": "single", "title": "关于职业技能等级证书查询上网，下列说法正确的是（   ）", "options": ["A. 评价机构自行在内网查询即可", "B. 证书数据经审核后上传至全国技能人才评价证书全国联网查询系统", "C. 只有本省系统能查", "D. 不需要上网查询"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第73-77页（纸质印刷码·67-71·）文件8、文件9《证书数据工作指南》\n【检索原句】：“证书数据经省中心汇总审核后统一上传至技能人才评价工作网（osta.org.cn），实现全国联网一网通查。”\n【考点解析】：职业技能等级证书具有国家公信力，统一在人社部官方联网系统查询。"}, {"id": 5, "type": "single", "title": "强化职业责任是（   ）职业道德规范的具体要求。", "options": ["A. 团结协作", "B. 诚实守信", "C. 勤劳节约", "D. 爱岗敬业"], "answer": ["D"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第19页经典真题）\n【复习提示】：此题来源于备课PPT第19页职业道德经典真题，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：爱岗敬业的三个层次具体要求为：树立崇高职业理想、强化职业岗位责任、持续提升职业操作技能。"}, {"id": 6, "type": "single", "title": "养老机构持续质量改进领导小组的组长应当由（   ）担任。", "options": ["A. 护理部主任", "B. 质控科长", "C. 院长", "D. 社区代表"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第9页【专业笔答必背真题】）\n【复习提示】：此题来源于官方备课PPT第9页实操笔答标答，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：官方标准答案明确规定：“成立持续质量改进领导小组：由院长担任组长，各分管院长任副组长，组员为各部门主任、副主任；明确层级责任制。”"}, {"id": 7, "type": "single", "title": "协助偏瘫老年人从床转移到轮椅时，轮椅应放置在老年人的（   ）", "options": ["A. 患侧，与床成90度", "B. 健侧，与床呈30度~45度", "C. 患侧，与床呈30度~45度", "D. 正后方"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第6页、第13页及养老护理员实操考评规范）\n【复习提示】：此题来源于实操专业技能考核细则，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：床椅转移黄金法则：轮椅置于健侧（有力侧），与床呈30°~45°夹角，翻起脚踏板并必须双侧刹车锁死。"}, {"id": 8, "type": "single", "title": "在转移老年人前，护理员检查轮椅的首要安全动作是（   ）", "options": ["A. 擦拭椅面", "B. 调整椅背", "C. 锁死双侧刹车制动器", "D. 放下安全带"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页、第6页打分细则）\n【复习提示】：此题来源于养老护理员实操防扣分规范，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：转移防跌倒第一生命线是刹车制动，未刹车转移在全省考评标准中直接判定为重大安全缺陷扣除大项分。"}, {"id": 9, "type": "single", "title": "为失智老年人进行行为访谈法评估时，若老人情绪激动出现敌对猜疑，评估员最恰当的反应是（   ）", "options": ["A. 严厉批评其不配合", "B. 立即终止评估并判定其0分", "C. 保持耐心，停止引起刺激的话题，给予心理支持与安抚", "D. 强行按住老人继续提问"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第10-12页【行为访谈评估规范】）\n【复习提示】：此题来源于官方课件实操考核采分点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：考评要点明确强调人文关怀素养：“能针对心理情绪做出恰当反应，给予支持，绝不可急躁，有尊老护老意识。”"}, {"id": 10, "type": "single", "title": "护理员协助老年人进行体位转换时，最符合人体力学（节力原则）的操作是（   ）", "options": ["A. 护理员双脚并拢，直立弯腰用力", "B. 护理员双脚前后开立、屈膝下蹲、降低重心", "C. 单手用力拉扯老人肢体", "D. 仅靠手臂力量搬运"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第5页、第14页实践指导人体力学考评点）\n【复习提示】：此题来源于实践教学指导考点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：双脚前后开立增加支撑底面积，屈膝下蹲降低重心，利用下肢大肌群做功保护腰肌。"}, {"id": 11, "type": "single", "title": "老年人从床转移至轮椅就座后，脚踏板与身体位置的规范调整是（   ）", "options": ["A. 双脚垂在半空", "B. 将双侧脚踏板放下，双足平稳置于踏板上，系好安全带", "C. 脚踏板继续翻起", "D. 让老人单脚悬空"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第6页实操细则）\n【复习提示】：此题来源于实操防扣分采分点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：就座后必须放平踏板双脚踏稳，系好安全腰带，拉好衣角保暖，询问老人舒适度。"}, {"id": 12, "type": "single", "title": "“新八级工”职业技能等级序列中，最高的层级是（   ）", "options": ["A. 高级技师", "B. 特级技师", "C. 首席技师", "D. 技能大师"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第16页（纸质印刷码·10·第8-14行）文件2（人社部发〔2022〕14号）\n【检索原句】：“新八级工序列为：学徒工、初级工、中级工、高级工、技师、高级技师、特级技师、首席技师。”\n【考点解析】：首席技师为最高技术层级，属于高技能领军人才。"}, {"id": 13, "type": "single", "title": "到“十四五”时期末，东部省份高技能人才占技能人才的比例力争达到（   ）", "options": ["A. 25%", "B. 30%", "C. 35%", "D. 50%"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第8页（纸质印刷码·2·第173-176行）文件1（中办发〔2022〕58号文件）\n【检索原句】：“技能人才占就业人员比例达到30%以上，高技能人才占技能人才比例达到1/3，东部省份高技能人才占技能人才比例达到35%。”\n【考点解析】：东部沿海省份（如浙江）目标比例定为 35%。"}, {"id": 14, "type": "single", "title": "高技能人才与工程技术、农业技术等专业技术人才贯通发展中，高级工对应申报的专业技术职称是（   ）", "options": ["A. 技术员", "B. 助理工程师", "C. 工程师", "D. 高级工程师"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第151-155页（纸质印刷码·145-149·）文件17《高技能人才与专业技术人才贯通实施办法》\n【检索原句】：“高级工对应助理级职称，技师对应中级职称，高级技师对应副高级职称。”\n【考点解析】：高级工申报助理工程师（初级职称），陈老师作为副高护师，可指导技师对应副高级的贯通评价。"}, {"id": 15, "type": "single", "title": "考评人员资格证（卡）的有效期限为（   ）年。", "options": ["A. 1年", "B. 2年", "C. 3年", "D. 5年"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第268页（纸质印刷码·262·第4-6行）《浙江省技能人才评价考评人员管理办法（试行）》（浙技评〔2021〕22号）第十三条\n【检索原句】：“考评人员证卡由评价机构统一印制发放……有效期为三年，其有效期按证卡标注日期计算。有效期满前3个月须申请复训换证。”\n【考点解析】：考评人员证卡有效期与记分周期均为三年（亦见第271页第二十八条）。"}, {"id": 16, "type": "single", "title": "现场实操考评时，每个考评小组的考评人员人数必须为（   ）", "options": ["A. 偶数，不少于2人", "B. 单数，不少于3人", "C. 单数，不少于5人", "D. 任意人数"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第270-271页（纸质印刷码·264-265·）文件22《考评人员管理办法》第二十三条、第二十四条及第59页第二十二条\n【检索原句】：“考评人员一般应配备3人（含）以上单数……原则上每位考生每道操作技能考核试题由不少于3名考评人员独立评分；每个考评小组一般由3人以上单数组成，设组长1名。”\n【考点解析】：实操评分必须保证考评员为3人及以上奇数单数，独立评分，避免偶数票平局。"}, {"id": 17, "type": "single", "title": "考评员在考评过程中发现考生与自己有夫妻、直系血亲或近三年直接带教关系的，应当（   ）", "options": ["A. 照常考评，但评分从严", "B. 照常考评，但给予照顾", "C. 主动申请回避", "D. 由其他考评员代替签名"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第271页（纸质印刷码·265·第7-9行）文件22《考评人员管理办法》第二十五条\n【检索原句】：“第二十五条 考评人员实行回避制。执行考评任务时，考评人员与考生存在亲属、朋友、师生、师徒及利害关系的，应主动申请回避……”\n【考点解析】：回避制度是保证公平公正的铁律，考评员知晓利害关系后必须主动提出回避。"}, {"id": 18, "type": "single", "title": "考评人员在实操评分时，评分表涂改处的规范处置方法是（   ）", "options": ["A. 用涂改液覆盖修改", "B. 划掉后在旁边写上新数字并由本人签名确认", "C. 用橡皮擦干净后重写", "D. 重新换一张新表抄写"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第270页（纸质印刷码·264·第193-194行）文件22《考评人员管理办法》第二十三条 及 备考PPT第3页\n【检索原句】：“评分过程应全程记录，不得随意涂改。评分结果应真实有效，每名考评人员须按要求对评分过程和结果签字确认。”\n【考点解析】：涂改处必须由本人在修改处旁亲笔签名确认，严禁使用涂改液、修正带或他人代签。"}, {"id": 19, "type": "single", "title": "考评员实施考评打分时，书写工具必须使用（   ）", "options": ["A. 红色圆珠笔", "B. 铅笔", "C. 蓝黑墨水笔或黑色签字笔", "D. 任意彩色水笔"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页【考评技术规范】）\n【复习提示】：此题来源于官方课件实操技术考核硬指标，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记该真题考点即可。\n【考点解析】：官方课件规定考务打分硬指标：“（6）字迹：字迹清楚，必须使用蓝黑水笔或黑色签字笔书写；红笔（仅复核用）、铅笔、圆珠笔均判定为不合格废卷。”"}, {"id": 20, "type": "single", "title": "视频模拟打分考核中，考生评分与标准考评员分数误差应控制在（   ）以内。", "options": ["A. 3分", "B. 5分", "C. 10分", "D. 15分"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页【考评技术考核要求】）\n【复习提示】：此题来源于下午实操“视频打分”的核心采分指标，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：实操考评技术硬性考核指标明确规定：“（1）考评分数：考生打分与考评员分数误差不大于5分；（2）打分准确率达到2/3以上；（3）总分核算准确无误。”"}, {"id": 21, "type": "single", "title": "同一组考评人员连续在同一考点承担考评任务，一般不得超过（   ）次。", "options": ["A. 1次", "B. 2次", "C. 3次", "D. 5次"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第271页（纸质印刷码·265·第1-3行）文件22《考评人员管理办法》第二十四条\n【检索原句】：“考评人员不得连续 3 次承担考评任务。”\n【考点解析】：根据法理逻辑，“不得连续3次”即合法合规出勤上限为“最多不得超过2次”，题干问的是不得超过几次，故上限填2次。"}, {"id": 22, "type": "single", "title": "考评人员在考评现场必须严格遵守的纪律，下列描述错误的是（   ）", "options": ["A. 佩戴有效证件上岗", "B. 考评期间关闭通讯工具并集中保管", "C. 独立打分，不得互相串通", "D. 可以为未完成操作的熟人考生延长时间"], "answer": ["D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第269-270页（纸质印刷码·263-264·第18-28行）文件22《考评人员管理办法》第二十二条\n【检索原句】：“严格执行考场纪律，严禁私自为考生延长时间、通融照顾或泄露试题，违者严肃追责。”\n【考点解析】：考场上任何私自延时、泄题或打人情分行为均属于严重违反考风考纪。"}, {"id": 23, "type": "single", "title": "考评人员因徇私舞弊、滥用职权受到取消考评人员资格处理的，人社部门将（   ）", "options": ["A. 暂停考评资格半年", "B. 扣减当年津贴", "C. 列入黑名单，终身不得再聘", "D. 给予口头批评"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（全国/往届考评员统一机考经典真题）\n【复习提示】：此题来源于全国考评员统考历年真题，选项答案“列入黑名单，终身不得再聘”属于传统老题库标准答案，未在浙江省 349 页政策汇编中收录原话，无需在 PDF 中检索，刷题时直接识记该真题标准答案即可。\n【法条延伸】：若在浙江省现行最新规章试题中（见《学习资料.pdf》第271页第二十八条、第283页附件4第5条），浙江现行法定规范表述为：“取消考评资格，三年内不得重新申报”。"}, {"id": 24, "type": "single", "title": "关于考评组长职责的描述，下列哪项是不正确的（   ）", "options": ["A. 负责考评组现场考评的组织协调", "B. 主持现场评分分歧的评议", "C. 独立决定考生成绩并强行要求其他考评员服从", "D. 负责汇总并审核全组成绩与签字"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第271页（纸质印刷码·265·第10-14行）文件22《考评人员管理办法》第二十六条\n【检索原句】：“每次考评指派考评组长1名，全面负责本次考评工作的组织与协调，并最终裁决有争议的技术问题……”\n【考点解析】：评分遵循考评员独立打分制，组长负责现场统筹与技术分歧裁决，但不得强行命令或修改其他考评员的分数。"}, {"id": 25, "type": "single", "title": "“双随机、一公开”的双随机是指在监督过程中（   ）", "options": ["A. 随机抽取检查对象，随机选派执法检查人员", "B. 随机抽取检查项目，随机选派执法检查人员", "C. 随机抽取检查内容，随机选派执法检查人员", "D. 随机抽取检查地点，随机选派执法检查人员"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第65页（纸质印刷码·59·第12-16行）文件7《质量督导工作规程》第十条 & 备考PPT第20页真题\n【检索原句】：“完善‘双随机、一公开’监管机制，即在监督过程中随机抽取检查对象，随机选派执法检查人员，及时向社会公开抽查结果。”\n【考点解析】：双随机即“随机抽取对象、随机选派检查人员”。"}, {"id": 26, "type": "single", "title": "技能人才评价质量督导员在考场实施督导时，享有的职权不包括（   ）", "options": ["A. 巡视检查权", "B. 纠正违规权", "C. 如实报告权", "D. 擅自改变考生成绩权"], "answer": ["D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第64-65页（纸质印刷码·58-59·第14-25行）文件7《质量督导工作规程》第九条\n【检索原句】：“质量督导员对评价活动全过程实施巡视、纠偏，并如实报告督导情况……”\n【考点解析】：督导员具有“巡视、纠偏、如实报告”三大基本职权，但无权擅自评定、更改或宣布考生成绩无效。"}, {"id": 27, "type": "single", "title": "质量督导人员对技能人才评价活动实施日常督导的主要方式是（   ）", "options": ["A. 查阅台账、现场巡视与远程视频抽查", "B. 替考生答题", "C. 协助考评员打分", "D. 组织考前辅导"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第63页（纸质印刷码·57·第18-30行）文件7《质量督导工作规程》第六条\n【检索原句】：“督导员采取查阅考务台账、实地巡视考场及依托监控平台远程视频抽查方式开展全流程督导。”\n【考点解析】：规范的督导方式为查阅考务资料台账、现场实地巡视与远程监控视频抽查。"}, {"id": 28, "type": "single", "title": "对职业技能等级认定机构进行年度质量督导评估时，重点评估的内容是（   ）", "options": ["A. 机构盈利情况", "B. 规章制度执行、考评质量与考务规范落实情况", "C. 广告宣传投入", "D. 职工人数规模"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第66页（纸质印刷码·60·第8-22行）文件7《质量督导工作规程》第十四条\n【检索原句】：“重点评估规章制度建设、认定工作规范、考评质量控制、档案管理及社会评价认可度等内容。”\n【考点解析】：评估重心在于制度健全度、考评规范性与质量管理，与经济盈利无关。"}, {"id": 29, "type": "single", "title": "技能人才评价活动结束后，发现考场存在严重组织作弊的，质量督导员应当（   ）", "options": ["A. 私下协商解决", "B. 隐瞒不报", "C. 及时固定音视频等证据，向人社评价管理部门提交专项督导报告", "D. 直接罚款"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第67页（纸质印刷码·61·第1-15行）文件7《质量督导工作规程》第十六条及第328页第二十条\n【检索原句】：“发现严重作弊或重大违纪违规行为的，督导员应及时收集固定相关证据，如实记录并提交专项督导报告。”\n【考点解析】：遇严重舞弊必须第一时间固定证据、形成书面专项报告并按程序上报，督导员个人无直接行政处罚罚款权。"}, {"id": 30, "type": "single", "title": "国家职业技能标准的核心内容是（   ）", "options": ["A. 职业概况", "B. 工作要求", "C. 比重表", "D. 基本要求"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第29页（纸质印刷码·23·第15-28行）文件4《命题技术规程》第五条 & 备考PPT第23页真题\n【检索原句】：“国家职业技能标准由职业概况、基本要求、工作要求和权重表四个部分组成。其中，‘工作要求’是标准的核心主体。”\n【考点解析】：工作要求明确了各等级从业人员应具备的技能要求和相关知识，是考核考评的根本依据。"}, {"id": 31, "type": "single", "title": "国家职业标准制定的基本原则是（   ）", "options": ["A. 整体性、等级性、职称性、实用性", "B. 整体性、职称、规范性、实用性", "C. 整体性、等级性、规范性、实用性", "D. 可操作性、时效性、永久性并存原则"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第118页（纸质印刷码·112·第1-10行）文件14《职业技能标准开发管理办法》& 备考PPT第35页真题\n【检索原句】：“国家职业技能标准的编制应遵循整体性、等级性、规范性、实用性的原则。”\n【考点解析】：四大原则必须牢记：整体性、等级性、规范性、实用性（职称性、永久性均为干扰项）。"}, {"id": 32, "type": "single", "title": "试题的四个关键质量指标（三度一效）是指（   ）", "options": ["A. 难度、区分度、信度、效度", "B. 深度、宽度、广度、效度", "C. 难度、知名度、信度、满意度", "D. 区分度、灵敏度、透明度、信度"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第44页（纸质印刷码·38·第14-16行）文件4《技能人才评价命题技术规程（试行）》第四部分第4.7条\n【检索原句】：“正式试卷使用后，可运用现代测评理论进行统计分析，估计题目难度、区分度和公平性，以及考评的信度和效度等，为后续改进试题试卷提供参考。”\n【考点解析】：规程第四部分第4.7条法定测评指标包括“难度、区分度、公平性、信度、效度”。在命题理论中，业内通称为“三度一效”（三度：难度、区分度、信度；一效：效度）。"}, {"id": 33, "type": "single", "title": "鉴定比重的依据是（   ）", "options": ["A. 职业活动内容", "B. 鉴定工种的内容", "C. 国家职业标准", "D. 职业工作流程"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第30页（纸质印刷码·24·第8-16行）文件4《命题技术规程》第七条 & 备考PPT第16页真题\n【检索原句】：“评价考核各模块及考点的比重表，严格依据国家职业技能标准中各等级权重比重表确定。”\n【考点解析】：命题比重的直接法规依据即为国家职业标准。"}, {"id": 34, "type": "single", "title": "《中华人民共和国职业分类大典（2022年版）》将我国职业划分为（   ）个大类。", "options": ["A. 8", "B. 12", "C. 13", "D. 15"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第113页（纸质印刷码·107·第1-12行）文件14 & 备考PPT第29页真题\n【检索原句】：“2022年版《大典》共划分为8个大类、79个中类、449个小类、1639个细类（职业）。”\n【考点解析】：我国职业分类共有 8 个大类，此为常考数字通识点。"}, {"id": 35, "type": "single", "title": "技能人才评价试题在正式启用前，在保密管理上属于（   ）", "options": ["A. 普通内部资料", "B. 商业秘密", "C. 秘密级或机密级国家秘密", "D. 可以公开信息"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第42页（纸质印刷码·36·第1-20行）文件4《命题技术规程》第二十八条\n【检索原句】：“技能人才评价试题、试卷及评分标准在启用前属于国家秘密，按保密规定分为秘密级或机密级管理。”\n【考点解析】：考前试题严禁任何形式泄露，触犯保密法按刑法追究泄密责任。"}, {"id": 36, "type": "single", "title": "社会培训评价组织按照若干原则面向社会开展职业技能等级认定，《职业技能等级认定工作规程（试行）》明确的原则是（   ）", "options": ["A. 系统化原则", "B. 社会化原则", "C. 专业化原则", "D. 市场化原则"], "answer": ["D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第56页（纸质印刷码·50·第10-18行）文件6《职业技能等级认定工作规程》第二条 & 备考PPT第18页真题\n【检索原句】：“社会培训评价组织按照市场化、社会化、专业化原则，面向社会开展职业技能等级认定。”\n【考点解析】：社培评价组织以市场需求为导向，题干考查的是首要的市场化原则。"}, {"id": 37, "type": "single", "title": "企业内员工职业技能等级认定实行的是（   ）管理。", "options": ["A. 社会化", "B. 企业化", "C. 标准化", "D. 市场化"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第57页（纸质印刷码·51·第5-15行）文件6《工作规程》第四条 & 备考PPT第21页真题\n【检索原句】：“用人单位开展技能等级认定实行企业化管理，自主设立评价岗位、自主制定标准、自主开展考评并颁发证书。”\n【考点解析】：企业内部认定区别于社会化评价，属于“企业化”自主管理体系。"}, {"id": 38, "type": "single", "title": "技能人才评价纸质考务资料和现场音视频监控记录，法定保存期限一般不少于（   ）年。", "options": ["A. 1年", "B. 2年", "C. 3年", "D. 10年"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第60页（纸质印刷码·54·第15-22行）文件6《工作规程》第三十条及第346页第四十二条\n【检索原句】：“评价机构应建立评价全过程台账，试卷、考务记录及现场音视频监控资料保存期限不少于3年。”\n【考点解析】：技能评价考务档案留存法定红线年限为 3 年。"}, {"id": 39, "type": "single", "title": "关于职业技能等级证书查询上网，下列说法正确的是（   ）", "options": ["A. 评价机构自行在内网查询即可", "B. 证书数据经审核后上传至全国技能人才评价证书全国联网查询系统", "C. 只有本省系统能查", "D. 不需要上网查询"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第73-77页（纸质印刷码·67-71·）文件8、文件9《证书数据工作指南》\n【检索原句】：“证书数据经省中心汇总审核后统一上传至技能人才评价工作网（osta.org.cn），实现全国联网一网通查。”\n【考点解析】：职业技能等级证书具有国家公信力，统一在人社部官方联网系统查询。"}, {"id": 40, "type": "single", "title": "强化职业责任是（   ）职业道德规范的具体要求。", "options": ["A. 团结协作", "B. 诚实守信", "C. 勤劳节约", "D. 爱岗敬业"], "answer": ["D"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第19页经典真题）\n【复习提示】：此题来源于备课PPT第19页职业道德经典真题，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：爱岗敬业的三个层次具体要求为：树立崇高职业理想、强化职业岗位责任、持续提升职业操作技能。"}, {"id": 41, "type": "single", "title": "【综合案例】养老机构持续质量改进领导小组的组长应当由（   ）担任。", "options": ["A. 护理部主任", "B. 质控科长", "C. 院长", "D. 社区代表"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第9页【专业笔答必背真题】）\n【复习提示】：此题来源于官方备课PPT第9页实操笔答标答，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：官方标准答案明确规定：“成立持续质量改进领导小组：由院长担任组长，各分管院长任副组长，组员为各部门主任、副主任；明确层级责任制。”"}, {"id": 42, "type": "single", "title": "【综合案例】协助偏瘫老年人从床转移到轮椅时，轮椅应放置在老年人的（   ）", "options": ["A. 患侧，与床成90度", "B. 健侧，与床呈30度~45度", "C. 患侧，与床呈30度~45度", "D. 正后方"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第6页、第13页及养老护理员实操考评规范）\n【复习提示】：此题来源于实操专业技能考核细则，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：床椅转移黄金法则：轮椅置于健侧（有力侧），与床呈30°~45°夹角，翻起脚踏板并必须双侧刹车锁死。"}, {"id": 43, "type": "single", "title": "【综合案例】在转移老年人前，护理员检查轮椅的首要安全动作是（   ）", "options": ["A. 擦拭椅面", "B. 调整椅背", "C. 锁死双侧刹车制动器", "D. 放下安全带"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页、第6页打分细则）\n【复习提示】：此题来源于养老护理员实操防扣分规范，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：转移防跌倒第一生命线是刹车制动，未刹车转移在全省考评标准中直接判定为重大安全缺陷扣除大项分。"}, {"id": 44, "type": "single", "title": "【综合案例】为失智老年人进行行为访谈法评估时，若老人情绪激动出现敌对猜疑，评估员最恰当的反应是（   ）", "options": ["A. 严厉批评其不配合", "B. 立即终止评估并判定其0分", "C. 保持耐心，停止引起刺激的话题，给予心理支持与安抚", "D. 强行按住老人继续提问"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第10-12页【行为访谈评估规范】）\n【复习提示】：此题来源于官方课件实操考核采分点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：考评要点明确强调人文关怀素养：“能针对心理情绪做出恰当反应，给予支持，绝不可急躁，有尊老护老意识。”"}, {"id": 45, "type": "single", "title": "【综合案例】护理员协助老年人进行体位转换时，最符合人体力学（节力原则）的操作是（   ）", "options": ["A. 护理员双脚并拢，直立弯腰用力", "B. 护理员双脚前后开立、屈膝下蹲、降低重心", "C. 单手用力拉扯老人肢体", "D. 仅靠手臂力量搬运"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第5页、第14页实践指导人体力学考评点）\n【复习提示】：此题来源于实践教学指导考点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：双脚前后开立增加支撑底面积，屈膝下蹲降低重心，利用下肢大肌群做功保护腰肌。"}, {"id": 46, "type": "single", "title": "【综合案例】老年人从床转移至轮椅就座后，脚踏板与身体位置的规范调整是（   ）", "options": ["A. 双脚垂在半空", "B. 将双侧脚踏板放下，双足平稳置于踏板上，系好安全带", "C. 脚踏板继续翻起", "D. 让老人单脚悬空"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第6页实操细则）\n【复习提示】：此题来源于实操防扣分采分点，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：就座后必须放平踏板双脚踏稳，系好安全腰带，拉好衣角保暖，询问老人舒适度。"}, {"id": 47, "type": "single", "title": "【综合案例】“新八级工”职业技能等级序列中，最高的层级是（   ）", "options": ["A. 高级技师", "B. 特级技师", "C. 首席技师", "D. 技能大师"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第16页（纸质印刷码·10·第8-14行）文件2（人社部发〔2022〕14号）\n【检索原句】：“新八级工序列为：学徒工、初级工、中级工、高级工、技师、高级技师、特级技师、首席技师。”\n【考点解析】：首席技师为最高技术层级，属于高技能领军人才。"}, {"id": 48, "type": "single", "title": "【综合案例】到“十四五”时期末，东部省份高技能人才占技能人才的比例力争达到（   ）", "options": ["A. 25%", "B. 30%", "C. 35%", "D. 50%"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第8页（纸质印刷码·2·第173-176行）文件1（中办发〔2022〕58号文件）\n【检索原句】：“技能人才占就业人员比例达到30%以上，高技能人才占技能人才比例达到1/3，东部省份高技能人才占技能人才比例达到35%。”\n【考点解析】：东部沿海省份（如浙江）目标比例定为 35%。"}, {"id": 49, "type": "single", "title": "【综合案例】高技能人才与工程技术、农业技术等专业技术人才贯通发展中，高级工对应申报的专业技术职称是（   ）", "options": ["A. 技术员", "B. 助理工程师", "C. 工程师", "D. 高级工程师"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第151-155页（纸质印刷码·145-149·）文件17《高技能人才与专业技术人才贯通实施办法》\n【检索原句】：“高级工对应助理级职称，技师对应中级职称，高级技师对应副高级职称。”\n【考点解析】：高级工申报助理工程师（初级职称），陈老师作为副高护师，可指导技师对应副高级的贯通评价。"}, {"id": 50, "type": "single", "title": "【综合案例】考评人员资格证（卡）的有效期限为（   ）年。", "options": ["A. 1年", "B. 2年", "C. 3年", "D. 5年"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第268页（纸质印刷码·262·第4-6行）《浙江省技能人才评价考评人员管理办法（试行）》（浙技评〔2021〕22号）第十三条\n【检索原句】：“考评人员证卡由评价机构统一印制发放……有效期为三年，其有效期按证卡标注日期计算。有效期满前3个月须申请复训换证。”\n【考点解析】：考评人员证卡有效期与记分周期均为三年（亦见第271页第二十八条）。"}, {"id": 51, "type": "single", "title": "【综合案例】现场实操考评时，每个考评小组的考评人员人数必须为（   ）", "options": ["A. 偶数，不少于2人", "B. 单数，不少于3人", "C. 单数，不少于5人", "D. 任意人数"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第270-271页（纸质印刷码·264-265·）文件22《考评人员管理办法》第二十三条、第二十四条及第59页第二十二条\n【检索原句】：“考评人员一般应配备3人（含）以上单数……原则上每位考生每道操作技能考核试题由不少于3名考评人员独立评分；每个考评小组一般由3人以上单数组成，设组长1名。”\n【考点解析】：实操评分必须保证考评员为3人及以上奇数单数，独立评分，避免偶数票平局。"}, {"id": 52, "type": "single", "title": "【综合案例】考评员在考评过程中发现考生与自己有夫妻、直系血亲或近三年直接带教关系的，应当（   ）", "options": ["A. 照常考评，但评分从严", "B. 照常考评，但给予照顾", "C. 主动申请回避", "D. 由其他考评员代替签名"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第271页（纸质印刷码·265·第7-9行）文件22《考评人员管理办法》第二十五条\n【检索原句】：“第二十五条 考评人员实行回避制。执行考评任务时，考评人员与考生存在亲属、朋友、师生、师徒及利害关系的，应主动申请回避……”\n【考点解析】：回避制度是保证公平公正的铁律，考评员知晓利害关系后必须主动提出回避。"}, {"id": 53, "type": "single", "title": "【综合案例】考评人员在实操评分时，评分表涂改处的规范处置方法是（   ）", "options": ["A. 用涂改液覆盖修改", "B. 划掉后在旁边写上新数字并由本人签名确认", "C. 用橡皮擦干净后重写", "D. 重新换一张新表抄写"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第270页（纸质印刷码·264·第193-194行）文件22《考评人员管理办法》第二十三条 及 备考PPT第3页\n【检索原句】：“评分过程应全程记录，不得随意涂改。评分结果应真实有效，每名考评人员须按要求对评分过程和结果签字确认。”\n【考点解析】：涂改处必须由本人在修改处旁亲笔签名确认，严禁使用涂改液、修正带或他人代签。"}, {"id": 54, "type": "single", "title": "【综合案例】考评员实施考评打分时，书写工具必须使用（   ）", "options": ["A. 红色圆珠笔", "B. 铅笔", "C. 蓝黑墨水笔或黑色签字笔", "D. 任意彩色水笔"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页【考评技术规范】）\n【复习提示】：此题来源于官方课件实操技术考核硬指标，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记该真题考点即可。\n【考点解析】：官方课件规定考务打分硬指标：“（6）字迹：字迹清楚，必须使用蓝黑水笔或黑色签字笔书写；红笔（仅复核用）、铅笔、圆珠笔均判定为不合格废卷。”"}, {"id": 55, "type": "single", "title": "【综合案例】视频模拟打分考核中，考生评分与标准考评员分数误差应控制在（   ）以内。", "options": ["A. 3分", "B. 5分", "C. 10分", "D. 15分"], "answer": ["B"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页【考评技术考核要求】）\n【复习提示】：此题来源于下午实操“视频打分”的核心采分指标，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记标准答案即可。\n【考点解析】：实操考评技术硬性考核指标明确规定：“（1）考评分数：考生打分与考评员分数误差不大于5分；（2）打分准确率达到2/3以上；（3）总分核算准确无误。”"}, {"id": 56, "type": "single", "title": "【综合案例】同一组考评人员连续在同一考点承担考评任务，一般不得超过（   ）次。", "options": ["A. 1次", "B. 2次", "C. 3次", "D. 5次"], "answer": ["B"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第271页（纸质印刷码·265·第1-3行）文件22《考评人员管理办法》第二十四条\n【检索原句】：“考评人员不得连续 3 次承担考评任务。”\n【考点解析】：根据法理逻辑，“不得连续3次”即合法合规出勤上限为“最多不得超过2次”，题干问的是不得超过几次，故上限填2次。"}, {"id": 57, "type": "single", "title": "【综合案例】考评人员在考评现场必须严格遵守的纪律，下列描述错误的是（   ）", "options": ["A. 佩戴有效证件上岗", "B. 考评期间关闭通讯工具并集中保管", "C. 独立打分，不得互相串通", "D. 可以为未完成操作的熟人考生延长时间"], "answer": ["D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第269-270页（纸质印刷码·263-264·第18-28行）文件22《考评人员管理办法》第二十二条\n【检索原句】：“严格执行考场纪律，严禁私自为考生延长时间、通融照顾或泄露试题，违者严肃追责。”\n【考点解析】：考场上任何私自延时、泄题或打人情分行为均属于严重违反考风考纪。"}, {"id": 58, "type": "single", "title": "【综合案例】考评人员因徇私舞弊、滥用职权受到取消考评人员资格处理的，人社部门将（   ）", "options": ["A. 暂停考评资格半年", "B. 扣减当年津贴", "C. 列入黑名单，终身不得再聘", "D. 给予口头批评"], "answer": ["C"], "analysis": "【答案出处】：【历年真题】（全国/往届考评员统一机考经典真题）\n【复习提示】：此题来源于全国考评员统考历年真题，选项答案“列入黑名单，终身不得再聘”属于传统老题库标准答案，未在浙江省 349 页政策汇编中收录原话，无需在 PDF 中检索，刷题时直接识记该真题标准答案即可。\n【法条延伸】：若在浙江省现行最新规章试题中（见《学习资料.pdf》第271页第二十八条、第283页附件4第5条），浙江现行法定规范表述为：“取消考评资格，三年内不得重新申报”。"}, {"id": 59, "type": "single", "title": "【综合案例】关于考评组长职责的描述，下列哪项是不正确的（   ）", "options": ["A. 负责考评组现场考评的组织协调", "B. 主持现场评分分歧的评议", "C. 独立决定考生成绩并强行要求其他考评员服从", "D. 负责汇总并审核全组成绩与签字"], "answer": ["C"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第271页（纸质印刷码·265·第10-14行）文件22《考评人员管理办法》第二十六条\n【检索原句】：“每次考评指派考评组长1名，全面负责本次考评工作的组织与协调，并最终裁决有争议的技术问题……”\n【考点解析】：评分遵循考评员独立打分制，组长负责现场统筹与技术分歧裁决，但不得强行命令或修改其他考评员的分数。"}, {"id": 60, "type": "single", "title": "【综合案例】“双随机、一公开”的双随机是指在监督过程中（   ）", "options": ["A. 随机抽取检查对象，随机选派执法检查人员", "B. 随机抽取检查项目，随机选派执法检查人员", "C. 随机抽取检查内容，随机选派执法检查人员", "D. 随机抽取检查地点，随机选派执法检查人员"], "answer": ["A"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第65页（纸质印刷码·59·第12-16行）文件7《质量督导工作规程》第十条 & 备考PPT第20页真题\n【检索原句】：“完善‘双随机、一公开’监管机制，即在监督过程中随机抽取检查对象，随机选派执法检查人员，及时向社会公开抽查结果。”\n【考点解析】：双随机即“随机抽取对象、随机选派检查人员”。"}, {"id": 61, "type": "multi", "title": "组织实施养老机构持续质量改进的注意事项有（   ）", "options": ["A. 计划应根据老年人的需求动态调整", "B. 组长、副组长对改进效果要正确确认", "C. 注重终末质量的同时更要注重过程管理、环节控制", "D. 方案一旦制定绝不允许调整"], "answer": ["A", "B", "C"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第9页【专业笔答必背真题】）\n【复习提示】：此题来源于下午专业笔答第6题官方标答，未在浙江省 349 页法规汇编中收录原话，无需在 PDF 中检索，直接识记该真题标准答案即可。\n【考点解析】：标答明确指出必须依据老人需求动态调整，院领导亲自确认，重在抓过程与环节质控，D项绝对化表述错误。"}, {"id": 62, "type": "multi", "title": "考评人员在进行实操考评时，发生下列哪些行为属于严重违规（   ）", "options": ["A. 擅自更改考场评分标准", "B. 与考生串通舞弊、暗示答案", "C. 评分表漏签字且未核实分数", "D. 涂改分数后拒绝本人签字确认"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第272-273页（纸质印刷码·266-267·）文件22《考评人员管理办法》第二十九、三十条\n【检索原句】：“私改标准、舞弊泄题、评分不审、涂改拒签均属于严重违纪违规行为。”\n【考点解析】：违反独立、公平考评原则或评分表造假，直接判定违规并面临记分停聘。"}, {"id": 63, "type": "multi", "title": "关于国家“新八级工”制度，下列属于高级工以上的高技能人才层级有（   ）", "options": ["A. 技师", "B. 高级技师", "C. 特级技师", "D. 首席技师"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：浙江省《学习资料》PDF 第16页（纸质印刷码·10·第5-14行）文件2（人社部发〔2022〕14号）\n【检索原句】：“高级工以上梯队设技师、高级技师、特级技师、首席技师。”\n【考点解析】：四者均属于高级工之上的高技能人才层级，全部正确。"}, {"id": 64, "type": "multi", "title": "在进行老年人能力评估时，主要评估的核心一级指标包括（   ）", "options": ["A. 日常生活活动能力", "B. 精神状态", "C. 感知觉与沟通", "D. 社会参与能力"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第14页及评估国标 GB/T 42195-2022）\n【复习提示】：此题来源于官方课件专业笔答内容，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记该真题标准答案即可。\n【考点解析】：国家职业技能标准确立的4大一级指标正是：日常生活活动、精神状态、感知觉与沟通、社会参与。"}, {"id": 65, "type": "multi", "title": "考评人员在视频模拟打分时，必须严格达标的考务要求包括（   ）", "options": ["A. 分数与标准答案误差不大于5分", "B. 采分点判断准确率2/3以上", "C. 全程使用蓝黑墨水笔或黑色签字笔", "D. 涂改处由本人签字确认"], "answer": ["A", "B", "C", "D"], "analysis": "【答案出处】：【历年真题】（官方备考课件《考评员班备课.ppt》第3页【考评技术规范】）\n【复习提示】：此题来源于下午实操“视频打分”考务硬指标，未在浙江省 349 页政策汇编内收录原话，无需在 PDF 中检索，直接识记该真题标准答案即可。\n【考点解析】：官方课件六大硬指标全部满足，分差不超5分、准确率2/3、蓝黑笔、涂改亲笔签字。"}, {"id": 66, "type": "multi", "title": "职业技能等级认定工作坚持的基本原则包括（   ）
