let currentPaperId = 1;
let currentIndex = 0;
let currentMode = 'practice'; // 'practice' | 'exam'
let userAnswers = {}; // key: "p1_q1" -> ["A"] or ["A","B"]
let submittedQuestions = new Set(); // 记录已提交判分的题目 key: "p1_q1"
let wrongQuestionKeys = new Set();
let isFilterWrongOnly = false;
let autoJumpTimer = null;
let examTimer = null;
let timeRemaining = 90 * 60;

const STORAGE_KEY = 'yaolao_kaoping_exam_records_v1';
let toastTimer = null;

function showToast(msg) {
  const toast = document.getElementById('toastBox');
  if (!toast) return;
  toast.innerText = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2200);
}

function showSaveBadge() {
  const badge = document.getElementById('saveStatusIndicator');
  if (!badge) return;
  badge.innerHTML = '<span style="display:inline-block;width:7px;height:7px;background:#22c55e;border-radius:50%;"></span> 自动存档';
  badge.style.opacity = '1';
}

function saveToStorage() {
  try {
    const state = {
      currentPaperId: currentPaperId,
      currentIndex: currentIndex,
      userAnswers: userAnswers,
      submittedQuestions: Array.from(submittedQuestions),
      wrongQuestionKeys: Array.from(wrongQuestionKeys),
      autoJump: document.getElementById('chkAutoJump') ? document.getElementById('chkAutoJump').checked : true
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    showSaveBadge();
  } catch (e) {
    console.warn('本地自动存档提示:', e);
  }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return false;

    if (data.userAnswers && typeof data.userAnswers === 'object') {
      userAnswers = data.userAnswers;
    }
    if (Array.isArray(data.submittedQuestions)) {
      submittedQuestions = new Set(data.submittedQuestions);
    }
    if (Array.isArray(data.wrongQuestionKeys)) {
      wrongQuestionKeys = new Set(data.wrongQuestionKeys);
    }
    if (data.currentPaperId && allPapersData.some(p => p.id === data.currentPaperId)) {
      currentPaperId = data.currentPaperId;
      const sel = document.getElementById('paperSelector');
      if (sel) sel.value = currentPaperId;
    }
    if (typeof data.currentIndex === 'number') {
      currentIndex = data.currentIndex;
    }
    if (data.autoJump !== undefined && document.getElementById('chkAutoJump')) {
      document.getElementById('chkAutoJump').checked = data.autoJump;
    }
    return true;
  } catch (e) {
    console.warn('读取本地存档失败:', e);
    return false;
  }
}

function resetCurrentPaper() {
  const paper = getCurrentPaper();
  const confirmed = confirm(
    "⚠️ 确定要清空【" + paper.name + "】的作答记录重新开始吗？\n\n" +
    "• 本套卷的得分、对错标记、已选选项将全部重置。\n" +
    "• 其他 9 套试卷的作答记录不受任何影响。"
  );
  if (!confirmed) return;

  paper.questions.forEach(q => {
    const qKey = "p" + paper.id + "_q" + q.id;
    delete userAnswers[qKey];
    submittedQuestions.delete(qKey);
    wrongQuestionKeys.delete(qKey);
  });

  currentIndex = 0;
  isFilterWrongOnly = false;
  const btnWrong = document.getElementById('btnFilterWrong');
  if (btnWrong) btnWrong.classList.remove('btn-primary');

  updateWrongCount();
  renderQuestion();
  updateSidebar();
  saveToStorage();
  showToast("【" + paper.name + "】记录已清空，可重新作答！");
}

function getCurrentPaper() {
  return allPapersData.find(p => p.id === currentPaperId) || allPapersData[0];
}

function getFilteredList() {
  const paper = getCurrentPaper();
  if (!isFilterWrongOnly) return paper.questions;
  return paper.questions.filter(q => wrongQuestionKeys.has("p" + paper.id + "_q" + q.id));
}

function initApp() {
  const hasSaved = loadFromStorage();
  updateWrongCount();
  renderQuestion();
  updateSidebar();
  if (hasSaved) {
    const paper = getCurrentPaper();
    showToast("💾 已自动恢复学习记录：" + paper.name + " · 第 " + (currentIndex + 1) + " 题");
  }
}

function changePaper(id) {
  currentPaperId = parseInt(id, 10);
  currentIndex = 0;
  isFilterWrongOnly = false;
  const btnWrong = document.getElementById('btnFilterWrong');
  if (btnWrong) btnWrong.classList.remove('btn-primary');
  updateWrongCount();
  if (currentMode === 'exam') {
    startExamTimer();
  }
  renderQuestion();
  updateSidebar();
  saveToStorage();
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btnModePractice').className = mode === 'practice' ? 'mode-btn active' : 'mode-btn';
  document.getElementById('btnModeExam').className = mode === 'exam' ? 'mode-btn active' : 'mode-btn';
  
  const timerBox = document.getElementById('timerBox');
  const btnFinish = document.getElementById('btnFinishExam');
  const autoJumpWrap = document.getElementById('autoJumpWrap');
  
  if (mode === 'exam') {
    timerBox.style.display = 'flex';
    btnFinish.style.display = 'block';
    autoJumpWrap.style.display = 'none';
    startExamTimer();
  } else {
    timerBox.style.display = 'none';
    btnFinish.style.display = 'none';
    autoJumpWrap.style.display = 'flex';
    clearInterval(examTimer);
  }
  renderQuestion();
  updateSidebar();
}

function startExamTimer() {
  clearInterval(examTimer);
  timeRemaining = 90 * 60;
  examTimer = setInterval(() => {
    timeRemaining--;
    if (timeRemaining <= 0) {
      clearInterval(examTimer);
      alert('考试时间到，已自动为您交卷！');
      submitExam();
      return;
    }
    const mins = Math.floor(timeRemaining / 60);
    const secs = timeRemaining % 60;
    document.getElementById('timerBox').innerText = "⏱️ " + mins + ":" + (secs < 10 ? '0' : '') + secs;
  }, 1000);
}

function renderQuestion() {
  clearTimeout(autoJumpTimer);
  const paper = getCurrentPaper();
  const list = getFilteredList();
  if (list.length === 0) {
    document.getElementById('questionTitle').innerText = "暂无错题！太棒了，当前试卷全部正确！🎉";
    document.getElementById('optionsList').innerHTML = '';
    document.getElementById('analysisBox').classList.remove('show');
    document.getElementById('btnMultiSubmit').style.display = 'none';
    updateSidebar();
    return;
  }
  if (typeof currentIndex !== 'number' || isNaN(currentIndex) || currentIndex < 0 || currentIndex >= list.length) {
    currentIndex = 0;
  }
  const q = list[currentIndex];
  if (!q) {
    currentIndex = 0;
    return;
  }
  const qKey = "p" + paper.id + "_q" + q.id;

  document.getElementById('progressInfo').innerText = "题号：" + (currentIndex + 1) + " / " + list.length + " (" + paper.name + ") " + (isFilterWrongOnly ? '【错题模式】' : '');
  document.getElementById('questionTag').innerText = q.type === 'single' ? '【单选题】(1分)' : '【多选题】(2分)';
  document.getElementById('questionTag').className = "tag " + q.type;
  document.getElementById('questionTitle').innerText = "第 " + q.id + " 题. " + q.title;

  const optionsContainer = document.getElementById('optionsList');
  optionsContainer.innerHTML = '';

  const ans = userAnswers[qKey] || [];
  // 核心逻辑：单选题选了即算提交；多选题必须点确认提交后才算提交
  const isSubmitted = currentMode === 'practice' && (
    (q.type === 'single' && ans.length > 0) || 
    (q.type === 'multi' && submittedQuestions.has(qKey))
  );

  q.options.forEach((optText) => {
    const optLetter = optText.trim().charAt(0);
    const item = document.createElement('div');
    item.className = 'option-item';
    item.innerText = optText;

    if (isSubmitted) {
      // 练习模式且已提交：标出对错
      const isSelected = ans.includes(optLetter);
      const isCorrectOption = q.answer.includes(optLetter);
      if (isCorrectOption) {
        item.classList.add('correct');
      } else if (isSelected && !isCorrectOption) {
        item.classList.add('wrong');
      }
    } else {
      // 正在作答中：如果选中则高亮
      if (ans.includes(optLetter)) {
        item.classList.add('selected');
      }
      item.onclick = () => onSelectOption(q, optLetter);
    }
    optionsContainer.appendChild(item);
  });

  const btnMulti = document.getElementById('btnMultiSubmit');
  const analysisBox = document.getElementById('analysisBox');

  // 多选题在未提交时显示提交按钮
  if (q.type === 'multi' && currentMode === 'practice' && !isSubmitted) {
    btnMulti.style.display = 'block';
  } else {
    btnMulti.style.display = 'none';
  }

  if (isSubmitted) {
    showAnalysis(q, ans);
  } else {
    analysisBox.classList.remove('show');
  }

  updateSidebar();
}

function onSelectOption(q, letter) {
  const paper = getCurrentPaper();
  const qKey = "p" + paper.id + "_q" + q.id;

  if (q.type === 'single') {
    userAnswers[qKey] = [letter];
    submittedQuestions.add(qKey);
    const isCorrect = (letter === q.answer[0]);
    if (!isCorrect) {
      wrongQuestionKeys.add(qKey);
    } else {
      wrongQuestionKeys.delete(qKey);
    }
    updateWrongCount();
    renderQuestion();
    saveToStorage();

    if (currentMode === 'practice' && isCorrect && document.getElementById('chkAutoJump').checked) {
      autoJumpTimer = setTimeout(() => {
        nextQuestion();
      }, 1000);
    }
  } else {
    // 多选题：自由勾选/取消勾选，不触发判分
    let current = userAnswers[qKey] ? [...userAnswers[qKey]] : [];
    if (current.includes(letter)) {
      current = current.filter(x => x !== letter);
    } else {
      current.push(letter);
      current.sort();
    }
    userAnswers[qKey] = current;
    renderQuestion();
    saveToStorage();
  }
}

function submitMultiAnswer() {
  const paper = getCurrentPaper();
  const list = getFilteredList();
  const q = list[currentIndex];
  const qKey = "p" + paper.id + "_q" + q.id;
  const ans = userAnswers[qKey] || [];
  if (ans.length === 0) {
    alert('请至少勾选一个选项后再点击提交！');
    return;
  }
  submittedQuestions.add(qKey);
  const isCorrect = (JSON.stringify(ans.sort()) === JSON.stringify(q.answer.sort()));
  if (!isCorrect) {
    wrongQuestionKeys.add(qKey);
  } else {
    wrongQuestionKeys.delete(qKey);
  }
  updateWrongCount();
  renderQuestion();
  saveToStorage();

  if (isCorrect && document.getElementById('chkAutoJump').checked) {
    autoJumpTimer = setTimeout(() => {
      nextQuestion();
    }, 1200);
  }
}

function showAnalysis(q, ans) {
  const box = document.getElementById('analysisBox');
  const isCorrect = (JSON.stringify(ans.sort()) === JSON.stringify(q.answer.sort()));
  const notice = document.getElementById('resultNotice');
  if (isCorrect) {
    notice.innerText = '🎉 回答正确！';
    notice.style.color = 'var(--success)';
  } else {
    notice.innerText = '❌ 回答错误！您的选择: ' + (ans.length > 0 ? ans.join('') : '未作答');
    notice.style.color = 'var(--danger)';
  }
  document.getElementById('correctAnswerBadge').innerText = '标准答案：' + q.answer.join('');
  
  // 结构化彩色卡片
  const lines = q.analysis.split('\n');
  const htmlOutput = lines.map(line => {
    line = line.trim();
    if (!line) return '';
    if (line.startsWith('【答案出处】：')) {
      const isPast = line.includes('历年真题');
      const badgeStyle = isPast 
        ? 'background:#fef3c7;color:#b45309;border:1px solid #fde68a;' 
        : 'background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe;';
      return `<div style="margin-top:6px;font-weight:700;font-size:0.93rem;"><span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:0.82rem;margin-right:6px;${badgeStyle}">${isPast ? '⭐ 历年真题' : '📘 法规出处'}</span>${line.replace('【答案出处】：', '')}</div>`;
    } else if (line.startsWith('【检索原句】：')) {
      return `<div style="margin-top:8px;background:#f0fdf4;border:1px solid #bbf7d0;border-left:4px solid #22c55e;padding:8px 12px;border-radius:6px;color:#166534;font-size:0.9rem;line-height:1.6;"><strong style="color:#15803d;display:block;margin-bottom:3px;">🔍 检索原句（支持在 349 页 PDF 按 Ctrl+F 精准查验）：</strong>${line.replace('【检索原句】：', '')}</div>`;
    } else if (line.startsWith('【复习提示】：')) {
      return `<div style="margin-top:8px;background:#fffbeb;border:1px solid #fde68a;border-left:4px solid #f59e0b;padding:8px 12px;border-radius:6px;color:#92400e;font-size:0.9rem;line-height:1.6;"><strong style="color:#b45309;display:block;margin-bottom:3px;">💡 备考提示（历年真题考点，无需在 349 页 PDF 检索）：</strong>${line.replace('【复习提示】：', '')}</div>`;
    } else if (line.startsWith('【法条延伸】：')) {
      return `<div style="margin-top:8px;background:#eff6ff;border:1px solid #bfdbfe;border-left:4px solid #3b82f6;padding:8px 12px;border-radius:6px;color:#1e40af;font-size:0.9rem;line-height:1.6;"><strong style="color:#1d4ed8;display:block;margin-bottom:3px;">⚖️ 浙江省现行法定规定拓展：</strong>${line.replace('【法条延伸】：', '')}</div>`;
    } else if (line.startsWith('【考点解析】：')) {
      return `<div style="margin-top:8px;color:#334155;font-size:0.9rem;line-height:1.6;"><strong style="color:#1e293b;display:block;margin-bottom:2px;">📖 考点解析：</strong>${line.replace('【考点解析】：', '')}</div>`;
    } else {
      return `<div style="margin-top:4px;color:#475569;font-size:0.9rem;line-height:1.6;">${line}</div>`;
    }
  }).join('');
  document.getElementById('analysisContent').innerHTML = htmlOutput;
  box.classList.add('show');
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
    saveToStorage();
  }
}

function nextQuestion() {
  const list = getFilteredList();
  if (currentIndex < list.length - 1) {
    currentIndex++;
    renderQuestion();
    saveToStorage();
  }
}

function updateWrongCount() {
  const paper = getCurrentPaper();
  let count = 0;
  paper.questions.forEach(q => {
    if (wrongQuestionKeys.has("p" + paper.id + "_q" + q.id)) count++;
  });
  document.getElementById('wrongCount').innerText = count;
}

function toggleWrongFilter() {
  isFilterWrongOnly = !isFilterWrongOnly;
  const btn = document.getElementById('btnFilterWrong');
  if (isFilterWrongOnly) {
    btn.classList.add('btn-primary');
    currentIndex = 0;
  } else {
    btn.classList.remove('btn-primary');
  }
  renderQuestion();
  saveToStorage();
}

// 核心：右侧常驻题号看板与进度统计更新
function updateSidebar() {
  const paper = getCurrentPaper();
  const list = getFilteredList();
  const total = paper.questions.length;
  
  let answeredCount = 0;
  let correctCount = 0;
  let wrongCount = 0;

  paper.questions.forEach(q => {
    const qKey = "p" + paper.id + "_q" + q.id;
    const ans = userAnswers[qKey] || [];
    const isSub = (q.type === 'single' && ans.length > 0) || (q.type === 'multi' && submittedQuestions.has(qKey));
    
    if (isSub) {
      answeredCount++;
      const isCorrect = (JSON.stringify(ans.sort()) === JSON.stringify(q.answer.sort()));
      if (isCorrect) correctCount++;
      else wrongCount++;
    } else if (currentMode === 'exam' && ans.length > 0) {
      answeredCount++;
    }
  });

  const unansweredCount = total - answeredCount;
  const pct = Math.round((answeredCount / total) * 100);

  // 进度条与文字
  document.getElementById('sideAnsweredCount').innerText = answeredCount;
  document.getElementById('sideTotalCount').innerText = total;
  document.getElementById('sideProgressPct').innerText = pct + '%';
  document.getElementById('sideProgressBarFill').style.width = pct + '%';
  document.getElementById('sideCorrectCount').innerText = correctCount;
  document.getElementById('sideWrongCount').innerText = wrongCount;
  document.getElementById('sideUnansweredCount').innerText = unansweredCount;

  // 同步移动端答题卡数据
  const mAns = document.getElementById('mAnsweredCount');
  if (mAns) {
    mAns.innerText = answeredCount;
    document.getElementById('mProgressPct').innerText = pct + '%';
    document.getElementById('mCorrect').innerText = correctCount;
    document.getElementById('mWrong').innerText = wrongCount;
    document.getElementById('mUnans').innerText = unansweredCount;
    document.getElementById('cardTitle').innerText = '答题卡 (' + paper.name + ')';
  }

  // 渲染右侧 1~80 方块矩阵
  const sideGrid = document.getElementById('sideGridNumbers');
  const modalGrid = document.getElementById('gridNumbers');
  sideGrid.innerHTML = '';
  modalGrid.innerHTML = '';

  list.forEach((q, idx) => {
    const qKey = "p" + paper.id + "_q" + q.id;
    const ans = userAnswers[qKey] || [];
    const isSub = (q.type === 'single' && ans.length > 0) || (q.type === 'multi' && submittedQuestions.has(qKey));
    const isCurr = (idx === currentIndex);

    // 1. 侧边栏按钮
    const btn = document.createElement('div');
    btn.className = 'side-num-btn';
    btn.innerText = q.id;
    if (isCurr) btn.classList.add('current');

    if (currentMode === 'practice') {
      if (isSub) {
        const isCorrect = (JSON.stringify(ans.sort()) === JSON.stringify(q.answer.sort()));
        if (isCorrect) btn.classList.add('correct');
        else btn.classList.add('wrong');
      }
    } else {
      if (ans.length > 0) btn.classList.add('answered-exam');
    }

    btn.onclick = () => {
      currentIndex = idx;
      renderQuestion();
      saveToStorage();
    };
    sideGrid.appendChild(btn);

    // 2. 弹窗答题卡（同步状态）
    const mBtn = document.createElement('div');
    mBtn.className = 'num-circle';
    mBtn.innerText = q.id;
    if (isCurr) mBtn.classList.add('current');
    if (currentMode === 'practice') {
      if (isSub) {
        const isCorrect = (JSON.stringify(ans.sort()) === JSON.stringify(q.answer.sort()));
        if (isCorrect) mBtn.classList.add('correct');
        else mBtn.classList.add('wrong');
      }
    } else {
      if (ans.length > 0) mBtn.classList.add('answered-exam');
    }
    mBtn.onclick = () => {
      currentIndex = idx;
      toggleAnswerCard();
      renderQuestion();
      saveToStorage();
    };
    modalGrid.appendChild(mBtn);
  });
}

function toggleAnswerCard() {
  const modal = document.getElementById('modalCard');
  modal.classList.toggle('show');
}

function submitExam() {
  clearInterval(examTimer);
  const paper = getCurrentPaper();
  let score = 0;
  let correctCount = 0;
  let wrongList = [];

  paper.questions.forEach(q => {
    const qKey = "p" + paper.id + "_q" + q.id;
    const ans = userAnswers[qKey] || [];
    const isCorrect = (JSON.stringify(ans.sort()) === JSON.stringify(q.answer.sort()));
    if (isCorrect) {
      correctCount++;
      score += (q.type === 'single' ? 1 : 2);
    } else {
      wrongList.push(q.id);
      wrongQuestionKeys.add(qKey);
    }
  });

  updateWrongCount();
  const passed = score >= 60;
  const msg = "【机考成绩单】\n\n" +
              "卷名：" + paper.name + "\n" +
              "总得分：" + score + " 分 (满分100分)\n" +
              "答对：" + correctCount + " 题 / 80 题\n" +
              "考核结果：" + (passed ? "🎉 考核合格 (达到60分合格线)" : "⚠️ 未合格 (需继续加强练习)") + "\n\n" +
              "做错题号：" + (wrongList.length > 0 ? wrongList.join(', ') : '无！全部做对！') + "\n\n" +
              "系统已自动将所有错题收入【错题专练】，点击确定即可切换为查看错题解析模式。";
  
  alert(msg);
  setMode('practice');
  isFilterWrongOnly = true;
  document.getElementById('btnFilterWrong').classList.add('btn-primary');
  currentIndex = 0;
  renderQuestion();
  saveToStorage();
}

function safeInitApp() {
  try {
    initApp();
  } catch (err) {
    console.error("初始化应用异常:", err);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', safeInitApp);
} else {
  safeInitApp();
}
window.addEventListener('load', safeInitApp);
window.addEventListener('pageshow', safeInitApp);

// 支持键盘快捷键：回车提交多选，左右箭头翻题
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const btn = document.getElementById('btnMultiSubmit');
    if (btn && btn.style.display !== 'none') {
      submitMultiAnswer();
    }
  } else if (e.key === 'ArrowRight') {
    nextQuestion();
  } else if (e.key === 'ArrowLeft') {
    prevQuestion();
  }
});

// 手机端点击遮罩层背景关闭答题卡
document.getElementById('modalCard').addEventListener('click', function(e) {
  if (e.target === this) toggleAnswerCard();
});
</script>
<div class="toast-notification" id="toastBox">💾 进度已自动恢复</div>
</body>
